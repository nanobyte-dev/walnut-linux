# A Walnut release image (docs/release/ALPHA.md M7), by hand only, from one of the two suites:
#   stable   version A.B.C: A.B from the file VERSION, C counted up (github-ci/release-id.sh); signed
#            by the archive key's signing subkey (environment walnut-stable: the owner approves),
#            published to walnut.nanobyte.dev/download/A.B.C/ and as the GitHub release vA.B.C
#   testing  a nightly, nightly-<date>-<time>-<commit>: the image follows testing; signed by the CI
#            key (environment walnut-testing), published to download/nightly/<id>/ (the newest 3
#            are kept), not on GitHub
#   build    the public image from that suite, its kernel, the internal install's initramfs and
#            the installer (github-ci/build-release.sh); no secrets (the Actions cache's salt is held by the two
#            small jobs around it, cache-restore and cache-save, which run no package code)
# A published release never changes: a new build is a new id.
name: "Walnut release"

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "stable (the next A.B.C) or testing (a nightly)"
        type: choice
        options: [stable, testing]
        default: testing
      publish:
        description: "Publish (off: build only, the files stay in the run's artifact for a look)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.channel }}  # one at a time: the next A.B.C is counted from what's published

jobs:
  cache-restore:
    # the only job (with cache-save) that holds the cache salt, and it runs no package code: it computes the
    # key, restores the layer and checks its MAC. The build job below installs our testing packages (some from
    # external sources) and never sees the salt.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      have: ${{ steps.have.outputs.have }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Cache key, salted (only a trusted job can compute it; exact key, no fallback)
        id: key
        env:
          SALT: ${{ secrets.WALNUT_CACHE_SALT }}
          BASE: ${{ hashFiles('system/image/packages.txt', 'tools/build-rootfs.sh', 'config.mk', 'build-containers/Dockerfile') }}
        run: |
          [ -n "$SALT" ] || { echo "-- no WALNUT_CACHE_SALT: no Actions cache in this run"; exit 0; }
          base="rootfs-base-$(printf '%s' "$BASE" | openssl dgst -sha256 -hmac "$SALT" -r | cut -c1-40)"
          echo "::add-mask::$base"  # the key stays out of the public log
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - name: The package layer (Debian's packages, from the build snapshot)
        if: steps.key.outputs.base != ''
        uses: actions/cache/restore@v6
        with:
          path: |
            build/rootfs/base.tar
            build/rootfs/base.tar.mac
          key: ${{ steps.key.outputs.base }}
      - name: Use the restored layer only when it is authentic (anyone can write a cache entry)
        if: steps.key.outputs.base != ''
        env:
          SALT: ${{ secrets.WALNUT_CACHE_SALT }}
        run: github-ci/cache-mac.sh verify build/rootfs/base.tar build/rootfs/base.tar.mac || [ $? = 3 ]
      - name: Is there an authentic layer
        id: have
        run: |
          if [ -f build/rootfs/base.tar ]; then echo "have=true" >> "$GITHUB_OUTPUT"; else echo "have=false" >> "$GITHUB_OUTPUT"; fi
      - name: Hand it to the build
        if: steps.have.outputs.have == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-base-in
          path: build/rootfs/base.tar
          retention-days: 1
          compression-level: 0

  layer:
    # on a miss: the Debian-only package layer, built from the pinned snapshot by `make rootfs-base`. No secret and
    # none of our packages here, so cache-save can sign what this job hands over; the build job never hands a
    # layer back (it installs our testing packages, some from external sources, as root on its runner).
    needs: cache-restore
    if: needs.cache-restore.outputs.have != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      sha256: ${{ steps.sum.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The runner (disk, qemu)
        run: github-ci/runner-prep.sh
      - name: The package layer
        run: make rootfs-base
      - name: Its sha256, for cache-save (the artifact is handed over through the run, the hash through a job output)
        id: sum
        run: echo "sha256=$(sha256sum build/rootfs/base.tar | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: release-base-new
          path: build/rootfs/base.tar
          retention-days: 1
          compression-level: 0

  build:
    needs: [cache-restore, layer]
    if: always() && needs.cache-restore.result == 'success' && (needs.cache-restore.outputs.have == 'true' || needs.layer.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      id: ${{ steps.id.outputs.id }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # versions count commits (tools/deb-version.sh)
          persist-credentials: false
      - name: Release id
        id: id
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          id=$(github-ci/release-id.sh "$CHANNEL")
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "### Walnut $id ($CHANNEL)" >> "$GITHUB_STEP_SUMMARY"
      - name: The package layer from the cache (cache-restore checked its MAC)
        if: needs.cache-restore.outputs.have == 'true'
        uses: actions/download-artifact@v8
        with:
          name: release-base-in
          path: build/rootfs
      - name: The package layer from the layer job
        if: needs.cache-restore.outputs.have != 'true'
        uses: actions/download-artifact@v8
        with:
          name: release-base-new
          path: build/rootfs
      - name: Build
        env:
          ID: ${{ steps.id.outputs.id }}
          CHANNEL: ${{ inputs.channel }}
        run: github-ci/build-release.sh "$ID" out "$CHANNEL"
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ steps.id.outputs.id }}
          path: out/
          retention-days: 7
          compression-level: 0

  cache-save:
    # records the layer's MAC and saves it: the layer is the layer job's, never the build job's
    needs: [cache-restore, layer]
    if: needs.cache-restore.outputs.have != 'true' && needs.layer.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Cache key, salted
        id: key
        env:
          SALT: ${{ secrets.WALNUT_CACHE_SALT }}
          BASE: ${{ hashFiles('system/image/packages.txt', 'tools/build-rootfs.sh', 'config.mk', 'build-containers/Dockerfile') }}
        run: |
          [ -n "$SALT" ] || { echo "-- no WALNUT_CACHE_SALT: no Actions cache in this run"; exit 0; }
          base="rootfs-base-$(printf '%s' "$BASE" | openssl dgst -sha256 -hmac "$SALT" -r | cut -c1-40)"
          echo "::add-mask::$base"
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - name: The new package layer
        if: steps.key.outputs.base != ''
        uses: actions/download-artifact@v8
        with:
          name: release-base-new
          path: build/rootfs
      - name: The layer is the one the layer job built (code in the build job holds the run token too)
        if: steps.key.outputs.base != ''
        env:
          WANT: ${{ needs.layer.outputs.sha256 }}
        run: |
          got=$(sha256sum build/rootfs/base.tar | cut -d' ' -f1)
          [[ $WANT =~ ^[0-9a-f]{64}$ && $got = "$WANT" ]] || { echo "::error::the layer is not the one the layer job built: not signed, not saved"; rm -f build/rootfs/base.tar; exit 1; }
      - name: Record the layer's MAC
        if: steps.key.outputs.base != ''
        env:
          SALT: ${{ secrets.WALNUT_CACHE_SALT }}
        run: github-ci/cache-mac.sh record build/rootfs/base.tar build/rootfs/base.tar.mac
      - name: Keep the package layer
        if: steps.key.outputs.base != ''
        uses: actions/cache/save@v6
        with:
          path: |
            build/rootfs/base.tar
            build/rootfs/base.tar.mac
          key: ${{ steps.key.outputs.base }}

  publish:
    needs: build
    if: inputs.publish
    runs-on: ubuntu-24.04
    environment: walnut-${{ inputs.channel }}
    permissions:
      contents: write  # the GitHub release
    steps:
      - name: Only from main
        if: inputs.channel == 'stable'
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::stable is published from refs/heads/main only"; exit 1; }
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: release-${{ needs.build.outputs.id }}
          path: out
      - name: Publish to walnut.nanobyte.dev
        env:
          ID: ${{ needs.build.outputs.id }}
          WALNUT_SIGN_KEY: ${{ inputs.channel == 'stable' && secrets.WALNUT_ARCHIVE_SUBKEY || secrets.WALNUT_TESTING_KEY }}
          WALNUT_SIGN_PASSPHRASE: ${{ inputs.channel == 'stable' && secrets.WALNUT_ARCHIVE_PASSPHRASE || '' }}
          WALNUT_DEPLOY_KEY_DATA: ${{ secrets.WALNUT_DEPLOY_KEY }}
        run: github-ci/publish-release.sh "$ID" out
      - name: The GitHub release
        if: inputs.channel == 'stable'
        env:
          ID: ${{ needs.build.outputs.id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          github-ci/release-notes.sh "$ID" out > notes.md
          pre=; [[ $ID == 0.* ]] && pre=--prerelease  # 0.x: alpha
          gh release create "v$ID" --target "$GITHUB_SHA" $pre \
            --title "Walnut $ID" --notes-file notes.md out/*
