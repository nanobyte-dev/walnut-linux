# Generated by github-ci/gen-workflows.py: don't edit, run it again.
# One package of Walnut (called by pkg-<name>.yml).
#   build           (tier trusted: a Debian source package from the pinned snapshot, or our own code)
#                   make <pkg>-deb on a GitHub runner (ppc64 under qemu). Its secrets are the shared ccache's
#                   login (the cache, nothing else) and the salt of the Actions cache keys.
#   build-external  (tier external: an upstream tarball or repository, or a download at build time)
#                   the same build with a contents: read token only (not kept on disk), no secret, no shared ccache and no Actions cache:
#                   whatever its code does it has nothing to steal, and it writes nothing a trusted job reads.
#                   Its debs still pass the publisher's name lists (github-ci/packages.toml).
#   The output (debs, -dbgsym debs, the source package) is kept as the artifact
#   walnut-<target>@<pkg>@<source>=<version> (github-ci/batch-publish.py name), 14 days.
#   testing  nothing more here: testing's one publisher (walnut-publish.yml, started when this
#            workflow finishes, and every 10 minutes) publishes every build not yet in testing, all in one upload
#   stable   publish: this one package, without the debug kernel and its modules, symbols to
#            stable-debug in the same upload; the archive key's signing subkey (environment
#            walnut-stable, secrets WALNUT_ARCHIVE_SUBKEY and WALNUT_ARCHIVE_PASSPHRASE; the owner
#            approves each run, after the build); from main only; dry_run stops after checking the keys
# Secrets come with `secrets: inherit` in the caller (environment secrets, the stable signing keys, reach a called
# workflow's jobs no other way); a step sees only the ones it references. WALNUT_DEPLOY_KEY (uploads), WALNUT_CCACHE_AUTH
# (the shared ccache) and WALNUT_CACHE_SALT (Actions cache keys) are referenced by trusted jobs only, never by
# build-external (workflow_lint refuses it).
# docs/release/ALPHA.md M6.
name: "(shared) build one package"

on:
  workflow_call:
    inputs:
      package:
        type: string
        required: true
      target:
        type: string
        default: testing
      tier:
        type: string
        required: true
      dry_run:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    if: inputs.tier == 'trusted'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      artifact: ${{ steps.output.outputs.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # versions count commits (tools/deb-version.sh)
          lfs: false
          persist-credentials: ${{ inputs.package == 'walnut-games' }}  # its git lfs pull needs the token
      - name: The gallery's screenshots from Git LFS
        # walnut-games' catalog packs the screenshots the catalog lists (tools/gamedb/pack-catalog.py): only
        # those are fetched, not every session's other shots and raw/ files (tools/gamedb/gallery.py)
        if: inputs.package == 'walnut-games'
        run: git lfs pull -I "$(python3 -I tools/gamedb/gallery.py --lfs-include)"
      - name: Cache keys, salted (only a trusted job can compute them; exact keys, no fallback)
        id: keys
        env:
          SALT: ${{ secrets.WALNUT_CACHE_SALT }}
          CHROOT: ${{ hashFiles('config.mk', 'tools/deb-chroot.sh', 'build-containers/Dockerfile.deb') }}
          SPU: ${{ hashFiles('packages/patched/toolchain/spu/**', 'tools/build-spu-toolchain.sh', 'build-containers/Dockerfile.spu', 'config.mk') }}
        run: |
          [ -n "$SALT" ] || { echo "-- no WALNUT_CACHE_SALT: no Actions cache in this job"; exit 0; }
          key() { printf '%s' "$2" | openssl dgst -sha256 -hmac "$SALT" -r | cut -c1-40 | sed "s/^/$1-/"; }
          chroot=$(key chroot "$CHROOT") spu=$(key spu "$SPU")
          echo "::add-mask::$chroot"  # the keys stay out of the public log
          echo "::add-mask::$spu"
          echo "chroot=$chroot" >> "$GITHUB_OUTPUT"
          echo "spu=$spu" >> "$GITHUB_OUTPUT"
      - name: The ppc64 base chroot
        if: steps.keys.outputs.chroot != ''
        uses: actions/cache@v6
        with:
          path: |
            build/chroot/sid-ppc64.tar
            build/chroot/sid-ppc64.tar.mac
          key: ${{ steps.keys.outputs.chroot }}
      - name: The spu-elf toolchain (ps3-spu)
        if: inputs.package == 'ps3-spu' && steps.keys.outputs.spu != ''
        uses: actions/cache@v6
        with:
          path: |
            build/spu/install
            build/spu/install.mac
          key: ${{ steps.keys.outputs.spu }}
      - name: Use restored caches only when they are authentic (anyone can write a cache entry)
        if: steps.keys.outputs.chroot != ''
        env:
          SALT: ${{ secrets.WALNUT_CACHE_SALT }}
        run: |
          github-ci/cache-mac.sh verify build/chroot/sid-ppc64.tar build/chroot/sid-ppc64.tar.mac || [ $? = 3 ]
          github-ci/cache-mac.sh verify build/spu/install build/spu/install.mac || [ $? = 3 ]
      - name: Build
        env:
          # the shared ccache at walnut.nanobyte.dev/ccache (tools/ccache-remote.sh), read and written
          WALNUT_CCACHE_AUTH: ${{ secrets.WALNUT_CCACHE_AUTH }}
        run: github-ci/build-package.sh ${{ inputs.package }} out ${{ inputs.target }}
      - name: Record the caches' MACs (the cache is saved after this step)
        if: always() && steps.keys.outputs.chroot != ''
        env:
          SALT: ${{ secrets.WALNUT_CACHE_SALT }}
        run: |
          github-ci/cache-mac.sh record build/chroot/sid-ppc64.tar build/chroot/sid-ppc64.tar.mac
          github-ci/cache-mac.sh record build/spu/install build/spu/install.mac
      - name: Name the output
        id: output
        run: echo "name=$(github-ci/batch-publish.py name ${{ inputs.target }} ${{ inputs.package }} out)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.output.outputs.name }}
          path: out/
          retention-days: 14
          compression-level: 0

  build-external:
    if: inputs.tier == 'external'
    permissions:
      contents: read  # the checkout only; the token is not kept on disk (persist-credentials: false)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      artifact: ${{ steps.output.outputs.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # versions count commits (tools/deb-version.sh)
          lfs: false
          persist-credentials: ${{ inputs.package == 'walnut-games' }}  # its git lfs pull needs the token
      - name: The gallery's screenshots from Git LFS
        # walnut-games' catalog packs the screenshots the catalog lists (tools/gamedb/pack-catalog.py): only
        # those are fetched, not every session's other shots and raw/ files (tools/gamedb/gallery.py)
        if: inputs.package == 'walnut-games'
        run: git lfs pull -I "$(python3 -I tools/gamedb/gallery.py --lfs-include)"
      - name: Build
        run: github-ci/build-package.sh ${{ inputs.package }} out ${{ inputs.target }}
      - name: Name the output
        id: output
        run: echo "name=$(github-ci/batch-publish.py name ${{ inputs.target }} ${{ inputs.package }} out)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.output.outputs.name }}
          path: out/
          retention-days: 14
          compression-level: 0

  publish-check:
    # parses the build's bytes (dpkg-deb, tar, leak-check) where no key exists: no environment, no secret
    needs: [build, build-external]
    if: always() && inputs.target == 'stable' && (needs.build.result == 'success' || needs.build-external.result == 'success')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      manifest: ${{ steps.check.outputs.manifest }}
    steps:
      - name: Only from main
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::stable is published from refs/heads/main only"; exit 1; }
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the expected version counts commits (tools/deb-version.sh)
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact || needs.build-external.outputs.artifact }}
          path: out
      - name: What this package may publish
        id: check
        # names, Sources, versions and relations against github-ci/packages.toml at this commit, and the names
        # against stable's index; nothing only warns on the way to stable
        run: |
          github-ci/batch-publish.py check-output --strict --suite stable --suite-index --manifest-out "$RUNNER_TEMP/manifest.json" ${{ inputs.package }} out
          echo "manifest=$(cat "$RUNNER_TEMP/manifest.json")" >> "$GITHUB_OUTPUT"


  stable-gate:
    # a stable publish by someone not on the allowlist waits here for the reviewers of walnut-stable-review (no secrets)
    needs: publish-check
    if: inputs.target == 'stable' && !contains(fromJSON(vars.WALNUT_STABLE_PUBLISHERS || '[]'), github.triggering_actor)
    runs-on: ubuntu-24.04
    environment: walnut-stable-review
    steps:
      - run: echo "approved by a reviewer of walnut-stable-review"

  publish:
    needs: [build, build-external, publish-check, stable-gate]
    if: always() && inputs.target == 'stable' && needs.publish-check.result == 'success' && (needs.stable-gate.result == 'success' || (needs.stable-gate.result == 'skipped' && contains(fromJSON(vars.WALNUT_STABLE_PUBLISHERS || '[]'), github.triggering_actor)))
    runs-on: ubuntu-24.04
    environment: walnut-stable
    steps:
      - name: Approved, or on the allowlist (checked here again, a skipped gate is no approval)
        env:
          GATE: ${{ needs.stable-gate.result }}
          PUBLISHERS: ${{ vars.WALNUT_STABLE_PUBLISHERS }}
          ACTOR: ${{ github.triggering_actor }}
        run: |
          if [ "$GATE" = success ]; then exit 0; fi
          fail() { echo "::error::not approved, and not on the allowlist"; exit 1; }
          [ "$GATE" = skipped ] || fail
          # the variable must be a JSON array of strings and hold exactly the actor's login (contains() in an `if`
          # would also match a substring of a JSON string)
          printf '%s' "${PUBLISHERS:-[]}" | jq -e --arg a "$ACTOR" 'type == "array" and all(.[]; type == "string") and any(.[]; . == $a)' >/dev/null || fail
      - name: Only from main
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::stable is published from refs/heads/main only"; exit 1; }
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact || needs.build-external.outputs.artifact }}
          path: out
      - name: The same bytes, checked again
        # python only, no dpkg-deb or leak-check here (publish-check ran them where no key exists); the
        # manifest binds the files
        env:
          WALNUT_MANIFEST: ${{ needs.publish-check.outputs.manifest }}
        run: |
          printf '%s' "$WALNUT_MANIFEST" > "$RUNNER_TEMP/manifest.json"
          github-ci/batch-publish.py check-output --strict --suite stable --suite-index --manifest "$RUNNER_TEMP/manifest.json" ${{ inputs.package }} out
      - name: Publish to stable
        env:
          WALNUT_SIGN_KEY: ${{ secrets.WALNUT_ARCHIVE_SUBKEY }}
          WALNUT_SIGN_PASSPHRASE: ${{ secrets.WALNUT_ARCHIVE_PASSPHRASE }}
          WALNUT_DEPLOY_KEY_DATA: ${{ secrets.WALNUT_DEPLOY_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = true ]; then
            github-ci/publish.sh --no-upload stable ${{ inputs.package }} out
          else
            github-ci/publish.sh stable ${{ inputs.package }} out
          fi
