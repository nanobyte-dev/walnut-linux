# One package of Walnut (called by pkg-<name>.yml, generated by tools/ci/gen-workflows.py).
#   build    make <pkg>-deb on a GitHub runner (ppc64 under qemu); its one secret is the shared ccache's
#            login (WALNUT_CCACHE_AUTH: the cache, nothing else)
#   publish  to the target suite, symbols (-dbgsym) to <target>-debug in the same upload:
#            testing  everything, debug kernel and debug modules included; the CI key
#                     (environment walnut-testing, secret WALNUT_TESTING_KEY)
#            stable   the release build, without the debug kernel and its modules; the archive key's
#                     signing subkey (environment walnut-stable, secrets WALNUT_ARCHIVE_SUBKEY and
#                     WALNUT_ARCHIVE_PASSPHRASE; the
#                     owner approves each run, after the build)
# Repository secrets: WALNUT_DEPLOY_KEY (uploads), WALNUT_CCACHE_AUTH (the shared ccache). docs/release/ALPHA.md M6.
name: "(shared) build one package"

on:
  workflow_call:
    inputs:
      package:
        type: string
        required: true
      target:
        type: string
        default: testing

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # versions count commits (tools/deb-version.sh)
          lfs: ${{ inputs.package == 'walnut-games' }}  # its catalog packs the Git LFS screenshots (tools/gamedb/pack-catalog.py)
      - name: The ppc64 base chroot
        uses: actions/cache@v6
        with:
          path: build/chroot/sid-ppc64.tar
          key: chroot-${{ hashFiles('config.mk', 'tools/deb-chroot.sh', 'docker/Dockerfile.deb') }}
      - name: The spu-elf toolchain (ps3-spu)
        if: inputs.package == 'ps3-spu'
        uses: actions/cache@v6
        with:
          path: build/spu/install
          key: spu-toolchain-${{ hashFiles('spu-toolchain/**', 'tools/build-spu-toolchain.sh', 'docker/Dockerfile.spu', 'config.mk') }}
      - name: Build
        env:
          # the shared ccache at walnut.nanobyte.dev/ccache (tools/ccache-remote.sh), read and written
          WALNUT_CCACHE_AUTH: ${{ secrets.WALNUT_CCACHE_AUTH }}
        run: tools/ci/build-package.sh ${{ inputs.package }} out ${{ inputs.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: debs-${{ inputs.package }}-${{ inputs.target }}
          path: out/
          retention-days: 7
          compression-level: 0

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: walnut-${{ inputs.target }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: debs-${{ inputs.package }}-${{ inputs.target }}
          path: out
      - name: Publish to ${{ inputs.target }}
        env:
          WALNUT_SIGN_KEY: ${{ inputs.target == 'stable' && secrets.WALNUT_ARCHIVE_SUBKEY || secrets.WALNUT_TESTING_KEY }}
          WALNUT_SIGN_PASSPHRASE: ${{ inputs.target == 'stable' && secrets.WALNUT_ARCHIVE_PASSPHRASE || '' }}
          WALNUT_DEPLOY_KEY_DATA: ${{ secrets.WALNUT_DEPLOY_KEY }}
        run: tools/ci/publish.sh ${{ inputs.target }} ${{ inputs.package }} out
