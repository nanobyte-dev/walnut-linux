# One package of Walnut (called by pkg-<name>.yml, generated by github-ci/gen-workflows.py).
#   build    make <pkg>-deb on a GitHub runner (ppc64 under qemu); its one secret is the shared ccache's
#            login (WALNUT_CCACHE_AUTH: the cache, nothing else). The output (debs, -dbgsym debs, the
#            source package) is kept as the artifact walnut-<target>@<pkg>@<source>=<version>
#            (github-ci/batch-publish.py name), 14 days.
#   testing  nothing more here: testing's one publisher (walnut-publish.yml, started when this
#            workflow finishes, and every 10 minutes) publishes every build not yet in testing, all
#            in one upload (github-ci/batch-publish.py)
#   stable   publish: this one package, without the debug kernel and its modules, symbols to
#            stable-debug in the same upload; the archive key's signing subkey (environment
#            walnut-stable, secrets WALNUT_ARCHIVE_SUBKEY and WALNUT_ARCHIVE_PASSPHRASE; the owner
#            approves each run, after the build)
# Repository secrets: WALNUT_DEPLOY_KEY (uploads), WALNUT_CCACHE_AUTH (the shared ccache). docs/release/ALPHA.md M6.
name: "(shared) build one package"

on:
  workflow_call:
    inputs:
      package:
        type: string
        required: true
      target:
        type: string
        default: testing

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      artifact: ${{ steps.output.outputs.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # versions count commits (tools/deb-version.sh)
          lfs: false
      - name: The gallery's screenshots from Git LFS
        # walnut-games' catalog packs the screenshots the catalog lists (tools/gamedb/pack-catalog.py): only
        # those are fetched, not every session's other shots and raw/ files (tools/gamedb/gallery.py)
        if: inputs.package == 'walnut-games'
        run: git lfs pull -I "$(python3 -I tools/gamedb/gallery.py --lfs-include)"
      - name: The ppc64 base chroot
        uses: actions/cache@v6
        with:
          path: build/chroot/sid-ppc64.tar
          key: chroot-${{ hashFiles('config.mk', 'tools/deb-chroot.sh', 'build-containers/Dockerfile.deb') }}
      - name: The spu-elf toolchain (ps3-spu)
        if: inputs.package == 'ps3-spu'
        uses: actions/cache@v6
        with:
          path: build/spu/install
          key: spu-toolchain-${{ hashFiles('packages/patched/toolchain/spu/**', 'tools/build-spu-toolchain.sh', 'build-containers/Dockerfile.spu', 'config.mk') }}
      - name: Build
        env:
          # the shared ccache at walnut.nanobyte.dev/ccache (tools/ccache-remote.sh), read and written
          WALNUT_CCACHE_AUTH: ${{ secrets.WALNUT_CCACHE_AUTH }}
        run: github-ci/build-package.sh ${{ inputs.package }} out ${{ inputs.target }}
      - name: Name the output
        id: output
        run: echo "name=$(github-ci/batch-publish.py name ${{ inputs.target }} ${{ inputs.package }} out)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.output.outputs.name }}
          path: out/
          retention-days: 14
          compression-level: 0

  publish:
    needs: build
    if: inputs.target == 'stable'
    runs-on: ubuntu-24.04
    environment: walnut-stable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: out
      - name: Publish to stable
        env:
          WALNUT_SIGN_KEY: ${{ secrets.WALNUT_ARCHIVE_SUBKEY }}
          WALNUT_SIGN_PASSPHRASE: ${{ secrets.WALNUT_ARCHIVE_PASSPHRASE }}
          WALNUT_DEPLOY_KEY_DATA: ${{ secrets.WALNUT_DEPLOY_KEY }}
        run: github-ci/publish.sh stable ${{ inputs.package }} out
