# One package of Walnut (called by pkg-<name>.yml, generated by tools/ci/gen-workflows.py).
#   build    make <pkg>-deb on a GitHub runner (ppc64 under qemu), no secrets
#   testing  the debs (debug kernel, debug modules and -dbgsym included) and the source package
#            into the testing suite, signed with the CI key (environment walnut-testing)
#   stable   by hand (release: true): testing's newest build of the package promoted to stable,
#            without the debug parts, signed with the archive signing subkey (environment
#            walnut-stable: add a required reviewer there)
# Secrets: WALNUT_DEPLOY_KEY (repository), WALNUT_TESTING_KEY (walnut-testing),
# WALNUT_ARCHIVE_SUBKEY (walnut-stable). docs/release/ALPHA.md M6.
name: Walnut package

on:
  workflow_call:
    inputs:
      package:
        type: string
        required: true
      release:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    if: ${{ !inputs.release }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # versions count commits (tools/deb-version.sh)
      - name: ccache
        uses: actions/cache@v4
        with:
          path: build/ccache
          key: ccache-${{ inputs.package }}-${{ github.sha }}
          restore-keys: ccache-${{ inputs.package }}-
      - name: The ppc64 base chroot
        uses: actions/cache@v4
        with:
          path: build/chroot/sid-ppc64.tar
          key: chroot-${{ hashFiles('config.mk', 'tools/deb-chroot.sh', 'docker/Dockerfile.deb') }}
      - name: Build
        run: tools/ci/build-package.sh ${{ inputs.package }} out
      - uses: actions/upload-artifact@v4
        with:
          name: debs-${{ inputs.package }}
          path: out/
          retention-days: 7
          compression-level: 0

  testing:
    needs: build
    runs-on: ubuntu-24.04
    environment: walnut-testing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: debs-${{ inputs.package }}
          path: out
      - name: Publish to testing
        env:
          WALNUT_SIGN_KEY: ${{ secrets.WALNUT_TESTING_KEY }}
          WALNUT_DEPLOY_KEY_DATA: ${{ secrets.WALNUT_DEPLOY_KEY }}
        run: tools/ci/publish.sh testing ${{ inputs.package }} out

  stable:
    if: ${{ inputs.release }}
    runs-on: ubuntu-24.04
    environment: walnut-stable
    steps:
      - uses: actions/checkout@v4
      - name: Promote to stable
        env:
          WALNUT_SIGN_KEY: ${{ secrets.WALNUT_ARCHIVE_SUBKEY }}
          WALNUT_DEPLOY_KEY_DATA: ${{ secrets.WALNUT_DEPLOY_KEY }}
        run: tools/ci/publish.sh stable ${{ inputs.package }}
