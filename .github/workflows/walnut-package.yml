# One package of Walnut (called by pkg-<name>.yml, generated by tools/ci/gen-workflows.py).
#   build    make <pkg>-deb on a GitHub runner (ppc64 under qemu), no secrets
#   publish  to the target suite, symbols (-dbgsym) to <target>-debug in the same upload:
#            testing  everything, debug kernel and debug modules included; the CI key
#                     (environment walnut-testing, secret WALNUT_TESTING_KEY)
#            stable   the release build, without the debug kernel and its modules; the archive key's
#                     signing subkey (environment walnut-stable, secret WALNUT_ARCHIVE_SUBKEY; the
#                     owner approves each run, after the build)
# Upload key: the repository secret WALNUT_DEPLOY_KEY. docs/release/ALPHA.md M6.
name: Walnut package

on:
  workflow_call:
    inputs:
      package:
        type: string
        required: true
      target:
        type: string
        default: testing

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # versions count commits (tools/deb-version.sh)
      - name: ccache
        uses: actions/cache@v4
        with:
          path: build/ccache
          key: ccache-${{ inputs.package }}-${{ github.sha }}
          restore-keys: ccache-${{ inputs.package }}-
      - name: The ppc64 base chroot
        uses: actions/cache@v4
        with:
          path: build/chroot/sid-ppc64.tar
          key: chroot-${{ hashFiles('config.mk', 'tools/deb-chroot.sh', 'docker/Dockerfile.deb') }}
      - name: Build
        run: tools/ci/build-package.sh ${{ inputs.package }} out ${{ inputs.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: debs-${{ inputs.package }}-${{ inputs.target }}
          path: out/
          retention-days: 7
          compression-level: 0

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: walnut-${{ inputs.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: debs-${{ inputs.package }}-${{ inputs.target }}
          path: out
      - name: Publish to ${{ inputs.target }}
        env:
          WALNUT_SIGN_KEY: ${{ inputs.target == 'stable' && secrets.WALNUT_ARCHIVE_SUBKEY || secrets.WALNUT_TESTING_KEY }}
          WALNUT_DEPLOY_KEY_DATA: ${{ secrets.WALNUT_DEPLOY_KEY }}
        run: tools/ci/publish.sh ${{ inputs.target }} ${{ inputs.package }} out
