    types: [completed]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: walnut-publish-testing
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      todo: ${{ steps.plan.outputs.todo }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the lists are read at each build's commit
      - name: What testing lacks
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          github-ci/batch-publish.py plan > "$RUNNER_TEMP/plan"
          cat "$RUNNER_TEMP/plan"
          echo "todo=$(sed -n 's/^todo //p' "$RUNNER_TEMP/plan")" >> "$GITHUB_OUTPUT"

  verify:
    # parses the builds (hostile bytes) where no secret exists: no environment, read-only token
    needs: check
    if: needs.check.outputs.todo != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: read
      actions: read
    outputs:
      manifest: ${{ steps.verify.outputs.manifest }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check what testing lacks
        id: verify
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          github-ci/batch-publish.py verify --dpkg-required --work "$RUNNER_TEMP/verify" --manifest-out "$RUNNER_TEMP/manifest.json"
          echo "manifest=$(cat "$RUNNER_TEMP/manifest.json")" >> "$GITHUB_OUTPUT"

  publish:
    # signs only what verify passed, with the same bytes (the manifest's hashes), after checking them again
    needs: [check, verify]
    if: needs.check.outputs.todo != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    environment: walnut-testing
    permissions:
      contents: read
      actions: write  # artifacts (deleting refused ones), and starting ps3rsx's build after linux
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Publish every build verify passed
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WALNUT_SIGN_KEY: ${{ secrets.WALNUT_TESTING_KEY }}
          WALNUT_DEPLOY_KEY_DATA: ${{ secrets.WALNUT_DEPLOY_KEY }}
          WALNUT_MANIFEST: ${{ needs.verify.outputs.manifest }}
        run: |
          printf '%s' "$WALNUT_MANIFEST" > "$RUNNER_TEMP/manifest.json"
          github-ci/batch-publish.py publish --work "$RUNNER_TEMP/publish" --manifest "$RUNNER_TEMP/manifest.json" --delete-refused
