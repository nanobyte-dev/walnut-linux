# Publishes walnut.nanobyte.dev's site (website/site/, with the Walnut Games database built
# into /gamedb/ by tools/gamedb/build.sh) on every push that changes them, or when started by hand. The upload
# goes to the walnut-upload container (write-only, no shell); the server's walnut-watch checks it,
# builds walnut-site:<id> and switches the container, and this job waits until the new version is
# served. Secret WALNUT_DEPLOY_KEY: the upload key (environment walnut-site; add a required reviewer
# there to gate it). The server's host key is pinned in servers/walnut.nanobyte.dev/known_hosts.
name: Walnut site

on:
  push:
    branches: [main]
    paths:
      - "website/gamedb/**"
      # the games database (gamedb/README.md), but not what the site never reads: a package's sources
      # other than its patches (the pages list their subjects), licensed data, benchmarks, menu
      # entries, backlogs, sessions' raw files
      - "gamedb/**"
      - "!gamedb/*/*/packages/**"
      - "gamedb/*/*/packages/*/patches/**"
      - "!gamedb/*/*/licensed/**"
      - "!gamedb/*/*/benchmark/**"
      - "!gamedb/*/*/desktop/**"
      - "!gamedb/*/*/todo.toml"
      - "!gamedb/**/raw/**"
      - "tools/gamedb/**"
      - "website/site/**"
      - "servers/walnut.nanobyte.dev/publish-site.sh"
      - ".github/workflows/walnut-site.yml"
  workflow_dispatch:

concurrency:
  group: walnut-site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: walnut-site
      url: https://walnut.nanobyte.dev
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true   # Walnut Games' screenshots
      - name: Upload and wait until live
        env:
          WALNUT_DEPLOY_KEY_DATA: ${{ secrets.WALNUT_DEPLOY_KEY }}
        run: |
          key="$RUNNER_TEMP/walnut-deploy"
          install -m 600 /dev/null "$key"
          printf '%s\n' "$WALNUT_DEPLOY_KEY_DATA" > "$key"
          WALNUT_DEPLOY_KEY="$key" servers/walnut.nanobyte.dev/publish-site.sh
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/walnut-deploy"
