# Debian source package this directory patches (tools/deb-fetch.sh, deb-prepare.sh, deb-build.sh).
# Boost.Context on ppc64 with its fcontext assembler (Debian #1146645): Debian builds the ucontext
# variant on ppc64, which lacks make/jump/ontop_fcontext that the headers use unless the consumer
# defines BOOST_USE_UCONTEXT, so wesnoth (asio spawn) failed to link and libboost_coroutine shipped
# with those symbols undefined. 0001 is the fix for Debian (ppc64 out of the ucontext list);
# 0002 adds the build profile pkg.boost.contextonly, which builds only libboost-context,
# -coroutine and -fiber (runtime and -dev): the headers and all other libraries stay Debian's
# 1.92.0-3, which our -dev packages depend on exactly. patches/0001 is for Boost upstream: the ppc64
# fcontext switch kept no FPRs (f14-f31), FPSCR or AltiVec registers but v31 (a double live across
# fiber::resume() came back with the other context's value; boost-context/test/: ctxtest.cpp, run-test.sh).
TYPE=debsrc
SOURCE=boost1.92
VERSION=1.92.0-3
DSC_SHA256=3a3e9fb07030108a5c88350d65267017613d790bc88b7ae45024d9901d27c405
BUILD=native
NATIVE_PROFILES=pkg.boost.contextonly
