# ClassiCube's data, Mojang's: its own source package, so the engine's source (classicube/)
# carries no Mojang file. The upstream tarball is made from our two downloads by the Makefile
# (CCD_ORIG: the texture pack static.classicube.net/default.zip in texpack/, the sounds and music
# from classicube/sounds.sh in audio/). Licensed content we may not redistribute: Section
# local/games and tools/licensed-packages.txt (this source's name too), so the package and its
# source go to the ps3-licensed suite only (tools/aptly-publish.sh), never to a public one.
# The version follows the engine's upstream version (classicube's Suggests).
TYPE=upstream
SOURCE=classicube-data
UPVER=1.3.8~git20261014.aa47929
DEBREV=1
ORIG=$CCD_ORIG
COMPONENTS=""
BUILD=indep
