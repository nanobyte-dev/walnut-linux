# Upstream source (not in Debian): the pinned ClassiCube tarball (config.mk pins it), repacked
# (+dfsg) without its console ports' assets (the Makefile's CC_DFSG_EXCLUDE): upstream's copies of
# Mojang's textures (the same files as static.classicube.net/default.zip, also zipped into the PS1
# and N64 ports and embedded in misc/ps1/classicubezip.h) and Minecraft's sounds, a 3DS banner
# sound of unknown origin and Sony's PS4 SDK modules. The Makefile makes the repack (CC_ORIG) and
# passes its path. The
# engine only: Mojang's texture pack and audio are a source package of their own (classicube-data/,
# Section local/games, the ps3-licensed suite only), so this source has nothing licensed in it and
# goes to ps3/ps3-dev with its source.
TYPE=upstream
SOURCE=classicube
UPVER=1.3.8~git20261014.aa47929+dfsg
DEBREV=1
ORIG=$CC_ORIG
COMPONENTS=""
BUILD=native
