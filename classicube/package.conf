# Upstream source (not in Debian): the pinned ClassiCube tarball plus two component tarballs made
# from our downloads (tools/deb-prepare.sh). The Makefile passes the paths (config.mk pins them).
# The texture pack (the Minecraft Classic textures from Mojang's client jars) and the audio (fetched
# from Mojang as the game's launcher would) are Mojang's: they build the classicube-data package
# (Section local/games), which tools/repo-publish.sh routes to the ps3-licensed suite. Never publish
# them outside the LAN; the engine (classicube) is free and goes to ps3/ps3-dev.
TYPE=upstream
SOURCE=classicube
UPVER=1.3.8~git20261014.aa47929
DEBREV=1
ORIG=$CC_TARBALL
COMPONENTS="texpack:$CC_TEXPACK audio:$CC_AUDIO"
BUILD=native
