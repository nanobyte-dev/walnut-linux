# Debian source package this directory patches (tools/deb-fetch.sh, deb-prepare.sh, deb-build.sh).
# DDNet 20.1.1 (a Teeworlds 0.6 descendant, own protocol): the pinned snapshot (20261013) still has
# 20.0+ds-2 and ppc64 only a stale 16.0.2, so the 20.1.1+ds-1 source (sid, uploaded after the
# snapshot) was put into build/sources/ddnet/ by hand from deb.debian.org and pinned here by the
# .dsc hash; deb-fetch.sh finds it there. Its build dependencies come from the snapshot. The
# upstream test Net.Ipv4AndIpv6Work hangs on the buildd under the sandbox: nocheck (the default here).
TYPE=debsrc
SOURCE=ddnet
VERSION=20.1.1+ds-1
DSC_SHA256=a63b01eb28f8d9c54a6b2d7a401c8acf40462ccde8e43b196e3531d24d8bf276
BUILD=native
