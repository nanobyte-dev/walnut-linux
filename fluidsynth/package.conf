# Debian source package this directory patches (tools/deb-fetch.sh, deb-prepare.sh, deb-build.sh).
# The PS3 runs libfluidsynth3 2.6.1+dfsg-1 (dsda-doom's MIDI music, OpenTTD, SDL_mixer); ours adds
# voice rendering on the SPEs through libspeq (docs/SPU-AUDIO.md, "fluidsynth"), setting overrides
# from /etc/fluidsynth/settings and FLUIDSYNTH_SETTINGS that win over the program's (0002), and the
# Dattorro reverb's taps without a division per sample (0003; docs/SPU-AUDIO.md "FluidSynth's reverb
# and chorus").
TYPE=debsrc
SOURCE=fluidsynth
VERSION=2.6.1+dfsg-1
BUILD=native
DSC_SHA256=a562a72ff78909664db45f2207451e1d3fea97943fa391bf63a92dfca8f1520f
