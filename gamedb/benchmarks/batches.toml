# gamedb/benchmarks/batches.toml: every benchmark batch once, in the order they were run
# (gamedb/benchmarks/README.md). Written by bench/analysis/matrix.py; tested, conclusion and observations
# are edited by hand (matrix.py keeps them).

[[batch]]
name = "2026-10-16-step0-vswap-off"
order = 1
kind = "run"
title = "Step 0: OpenArena tc0/tc1 on Mesa ps3.152 (VRAM swap off; nothing on screen)"
date = 2026-10-16
runs = 14
stack = { mesa = "ps3.152" }
tested = "The first OpenArena timedemo runs on the PS3, comparing plain textures with compressed (DXT1) textures made by Mesa's own encoder, VRAM swap off. The first compressed texture ever drawn on the RSX was sampled too."
conclusion = "Not valid as frame rates: nothing reached the screen. The load times and VRAM still count: Mesa's encoder added about 1.5 s to the level load, and compressed textures cut the game's VRAM from 51.7 to 40.3 MB."
observations = """
- Nothing reached the screen: no window manager ran, and the ps3rsx driver muted the video for every X session after the first (fixed later). The frame rates are not measurements of a shown picture; kept as history.
- First compressed texture sampled on the RSX: blocks within 1 of the decoded value, no GPU error. Mesa's encoder ran at 2.6 Mpixel/s with an error (RMSE) of 29.7.
- The GPU reports itself as NV47 with 245 MB of video memory and OpenGL 2.1.
- First OpenArena launch (plain textures): 49.6 fps, level load 14.3 s.
- Plain textures, 6 runs: 49.8 fps, level load 13.98 s (13.51 to 14.37).
- Compressed textures, 6 runs: 51.6 fps, level load 15.50 s (14.99 to 15.98). The very first compressed run made 43.1 fps with a 3.3 s longest frame.
- Mesa's encoder on the main CPU (the PPE) adds about 1.5 s to the load.
- The VRAM survey puts the game at 51.7 MB with plain textures and 40.3 MB compressed."""
source = "bench/results row 1"

[[batch]]
name = "2026-10-16-step0-vswap-on"
order = 2
kind = "run"
title = "Step 0: OpenArena tc0/tc1 on Mesa ps3.152 (VRAM swap on; nothing on screen)"
date = 2026-10-16
runs = 6
stack = { mesa = "ps3.152" }
tested = "The same OpenArena comparison of plain and compressed textures on Mesa ps3.152, now with the VRAM swap on."
conclusion = "Not valid as frame rates (nothing on screen). The load times show Mesa's encoder costing 1.1 s of load and causing hitches in play, so compressed textures were not shipped with that encoder."
observations = """
- Same setup as the previous batch with the VRAM swap on, 3 pairs of runs.
- Nothing on screen, so the frame rates are invalid.
- Plain textures: 48.8 fps, load 14.02 s (13.94 to 14.63).
- Compressed: 52.4 fps, load 15.14 s (15.10 to 15.70). One compressed run had a 4.4 s longest frame.
- These are the survey's VRAM-swap-on numbers: Mesa's encoder costs 1.1 s of load and hitches in play, so compressed textures were not shipped with it."""
source = "bench/results row 2"

[[batch]]
name = "2026-10-16-step0-sound"
order = 3
kind = "run"
title = "Step 0: OpenArena sound variants A/B/B22/C/Z (nothing on screen)"
date = 2026-10-16
runs = 15
tested = "How much OpenArena's sound costs: stock OpenAL, two tuned OpenAL settings, the game's own mixer, and sound off."
conclusion = "Sound off was about 10% faster (55.3 against 49.7 to 50.0 fps) and no OpenAL setting helped. The result is weak: nothing was on screen, the tuned settings later turned out to change more than intended, and the gap was not repeated with a picture in these runs."
observations = """
- 3 interleaved runs per variant, VRAM swap on. Nothing on screen, so the absolute fps are invalid.
- A, stock OpenAL: 49.7 fps.
- B, OpenAL with 16-bit output and a linear resampler: 49.8.
- B22, the same at 22 kHz: 50.0.
- C, the game's own mixer instead of OpenAL: 50.0.
- Z, sound off: 55.3 fps, level load 11.9 s against 13.8 to 14.1 s, about 7 MB more free memory.
- Reading at the time: sound costs about 10% of the frame rate and no OpenAL setting helps.
- Caveats found later: B also switched on OpenAL's output limiter and dither, and B22 probably still ran at 48 kHz. The sound-on against sound-off difference was not repeated with the picture on screen in these runs."""
source = "bench/results row 3"

