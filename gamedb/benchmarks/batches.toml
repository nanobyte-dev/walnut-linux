[[batch]]
name = "2026-10-16-mesa-223-neverball-wedge"
order = 17
kind = "run"
title = "Mesa ps3.223 Neverball wedges the RSX (graph exception 0x105)"
date = 2026-10-16
runs = 1
stack = { mesa = "ps3.223" }
tested = "Neverball's first run, on Mesa ps3.223."
conclusion = "It locked up the GPU, which only a console reboot clears. The cause was a texture read from a misaligned address during software mipmap generation; fixed by Mesa 0014 (ps3.225), and ps3rsx 0.249 refuses such addresses too."
observations = """
- The kernel rejected a command buffer (an input/output error) and logged a graphics exception from Neverball.
- The RSX was wedged: only a console reboot clears it. The run was killed at the 60 s cap.
- Cause, found next: Mesa's 3D blit read the 2x2 level of a 32x32 luminance-alpha texture at an address not aligned to 128 bytes, while generating mipmaps in software for a format nv30 cannot render to.
- Fixed by Mesa 0014 (ps3.225); ps3rsx 0.249 also refuses such offsets."""
source = "bench/results row 17"

