[[batch]]
name = "2026-10-16-speq-ppe-dxt1"
order = 5
kind = "run"
title = "libspeq PPE DXT1 encoder in Mesa ps3.186 (kernel .178; nothing on screen)"
date = 2026-10-16
runs = 10
stack = { kernel = "ps3.178", mesa = "ps3.186" }
tested = "Whether libspeq's faster DXT1 encoder, called from Mesa ps3.186 on the main CPU, removes the load-time cost of compressed textures in OpenArena."
conclusion = "Mostly: compression now costs 0.5 s of load instead of 1.5 s, without hitches, and the game's VRAM falls from 51.6 to 37.5 MB. This was the basis for shipping compressed textures in OpenArena. The frame rates are invalid (nothing on screen)."
observations = """
- Mesa ps3.186 with patch 0011, which hands DXT1 compression to libspeq's encoder on the PPE (the main CPU). Kernel ps3.178, VRAM swap on, 5 pairs of runs.
- Plain textures: 49.9 fps, load 13.68 s (13.66 to 13.87).
- Compressed: 53.0 fps, load 14.16 s (14.08 to 14.68). Compression now adds 0.5 s of load instead of 1.5 s.
- Longest frame 956 ms compressed against 1008 ms plain (medians): no hitch.
- Game VRAM 51.6 MB plain, 37.5 MB compressed (survey).
- This encoder runs at 6.5 Mpixel/s through glTexImage, against 2.6 for Mesa's.
- Nothing on screen, so the fps are invalid. Load, VRAM and the encoder comparison don't depend on the display.
- Basis for shipping compressed textures on in OpenArena."""
source = "bench/results row 5"

[[batch]]
name = "2026-10-16-speq-spu-queue"
order = 6
kind = "run"
title = "libspeq SPU queue probes speq-bench (kernel .178)"
date = 2026-10-16
runs = 3
stack = { kernel = "ps3.178" }
tested = "Basic costs of libspeq's job queue on the SPEs (the Cell's helper cores): how fast a job starts, how fast data moves, and what a crashing job does. No game ran."
conclusion = "The queue works and is fast enough to build on: an idle worker takes a job in 9.8 us, DMA reaches about 20 GB/s, and a crashing job fails cleanly in 1 ms. The wait was changed to spin 80 us before sleeping, since a sleep costs 61.3 us more."
observations = """
- No game, so no game numbers. 6 SPEs.
- Handing a job to an idle worker: 9.8 us typical, 65.1 us at the 99th percentile with six SPEs (all six workers wake for each job).
- Sleeping costs 61.3 us more than spinning, so the wait now spins 80 us instead of 20 before it sleeps.
- A parked worker resumes in 88 us. A new SPE context takes 3.2 ms, opening one 1.6 ms. Each context uses 320 KB of kernel memory, all returned when it closes.
- DMA from one SPE: 12.4 GB/s reading and 18.4 GB/s writing main memory; six together 20.1 and 19.4 GB/s.
- A fatal SPU fault fails that job with an error in 1.0 ms, and the next job runs after a 3.4 ms restart."""
source = "bench/results row 6"

[[batch]]
name = "2026-10-16-speq-spu-dxt1"
order = 7
kind = "run"
title = "libspeq SPU DXT1 encoder 0.210 (Mesa ps3.186; nothing on screen)"
date = 2026-10-16
runs = 14
stack = { mesa = "ps3.186" }
tested = "libspeq 0.210's DXT1 encoder on the SPEs: whether it matches the reference output, how fast it is, and whether it removes the load cost of compressed textures in OpenArena."
conclusion = "Yes on all three: byte-for-byte correct, 1173 Mpixel/s against 6.7 on the PPE, and compressed textures now load as fast as plain ones (13.63 s against 13.84 s). The load, VRAM and SPU results stand; the fps are invalid because nothing was on screen."
observations = """
- libspeq 0.210 with the SPU DXT1 encoder, chosen automatically; Mesa ps3.186; VRAM swap on.
- Correctness check passes: 100 images encoded on the SPEs and 3 on the PPE equal the reference byte for byte; a faulting job is redone on the PPE; 0 failures.
- Speed: 1173 Mpixel/s on six SPEs for a 1024x1024 image, against 6.7 on the PPE. Through glTexImage: 352 Mpixel/s against 6.5 with the PPE encoder. Blocks still sample within 1.
- OpenArena, 5 pairs: load 13.84 s plain (13.70 to 15.74) against 13.63 s compressed (13.45 to 15.39), so compression no longer costs load time. 49.1 and 52.7 fps.
- Game VRAM 51.7 MB plain, 37.5 MB compressed (survey).
- A debug run counted 1476 compressions per level load, 254 of them on the SPEs, 0 failures.
- One plain run at 39.6 fps with a 3.2 s longest frame is an outlier.
- Nothing on screen, so the fps are invalid."""
source = "bench/results row 7"

