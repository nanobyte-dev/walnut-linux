# gamedb/benchmarks/caveats.toml: benchmark numbers that are not what their column says, or not comparable with
# plain runs (gamedb/benchmarks/README.md "Caveats"). Each [[caveat]] names a batch, optionally one game of it
# (and one variant of that game); the Test runs tab marks those rows. kind: "invalid" (the frame rate is not a
# frame rate of the picture shown) or "not-comparable" (measured right, but slowed by a profiler or another
# recording). why: the reason in one sentence, from the batch's observations.
# Validated by tools/gamedb/check.py (caveats_errors).

