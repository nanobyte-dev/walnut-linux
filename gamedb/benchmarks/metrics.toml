# gamedb/benchmarks/metrics.toml: every number a benchmark result holds (gamedb/benchmarks/README.md).
# name: the key in games/<id>/benchmark/results/<batch>.toml and the CSV matrix's file name; unit; better
# (higher or lower); matrix: always (a CSV matrix of its own), when-set (a CSV matrix once a batch has the
# number), none (no matrix: a summary's number); tool: what computes it (bench/analysis/report.py's run key, then
# bench/analysis/matrix.py's median over a batch's runs of one game-variant, rounded to 0.1); what: the meaning.
# bench/analysis/matrix.py's METRICS has a getter for every metric with a matrix (check.py: the two agree).

[[metric]]
name = "fps"
unit = "frames a second"
better = "higher"
matrix = "always"
tool = "bench/analysis/report.py fps (the game's own counter), else hud_med (the Gallium HUD median after the load); matrix.py --hud GAME: hud_med"
what = "the game's own frame rate (timedemo, replay or fixed-frame counter), else the Gallium HUD median after loading; for a repeated demo the first pass"

[[metric]]
name = "cpu"
unit = "seconds"
better = "lower"
matrix = "always"
tool = "bench/analysis/report.py cpu (the client's user+sys)"
what = "the client's user+sys seconds for the whole run"

[[metric]]
name = "underruns"
unit = "underruns"
better = "lower"
matrix = "always"
tool = "bench/analysis/report.py xrun (bench.txt underruns=); matrix.py counts game.log's \"underrun occurred\" lines for runs before 2026-10-17 03:50"
what = "ALSA underruns in the run (audible chopping)"

[[metric]]
name = "ram_free"
unit = "MiB"
better = "higher"
matrix = "always"
tool = "bench/analysis/report.py avail (KiB) / 1024"
what = "lowest MemAvailable during the run"

[[metric]]
name = "vram"
unit = "MiB"
better = "lower"
matrix = "always"
tool = "bench/analysis/report.py vram (KiB, ps3rsx per-client) / 1024"
what = "the game's peak VRAM, all its buffers"

[[metric]]
name = "fps_steady"
unit = "frames a second"
better = "higher"
matrix = "always"
tool = "bench/analysis/report.py steady; matrix.py --hud GAME: hud_win"
what = "the steady-state frame rate: the median of the game's own fps over its counted passes, the game's own result over its window, else the median of the HUD's per-second fps in the window"

[[metric]]
name = "low1"
unit = "frames a second"
better = "higher"
matrix = "always"
tool = "bench/analysis/report.py low1"
what = "the 1% low in the window: 1000 / the 99th percentile frame time (HUD frame times; with per-second data only, the slowest 1% of seconds)"

[[metric]]
name = "stalls"
unit = "frames"
better = "lower"
matrix = "always"
tool = "bench/analysis/report.py stalls"
what = "frames over 100 ms in the window (per-second data only: seconds under 10 fps)"

[[metric]]
name = "longest_ms"
unit = "ms"
better = "lower"
matrix = "always"
tool = "bench/analysis/report.py longest"
what = "the longest frame in the window (HUD frame times, else the game's own per-pass longest)"

[[metric]]
name = "stall_disk_s"
unit = "seconds"
better = "lower"
matrix = "when-set"
tool = "bench/analysis/report.py stall_disk_s (bench/analysis/stalls.py; runs recorded with STALLS=1)"
what = "seconds of the window's stalls spent waiting on the disk (docs/STALLS.md says how a cause is decided)"

[[metric]]
name = "stall_swap_s"
unit = "seconds"
better = "lower"
matrix = "when-set"
tool = "bench/analysis/report.py stall_swap_s (bench/analysis/stalls.py; runs recorded with STALLS=1)"
what = "seconds of the window's stalls spent on swap (zram and VRAM swap)"

[[metric]]
name = "stall_reclaim_s"
unit = "seconds"
better = "lower"
matrix = "when-set"
tool = "bench/analysis/report.py stall_reclaim_s (bench/analysis/stalls.py; runs recorded with STALLS=1)"
what = "seconds of the window's stalls spent in direct reclaim, compaction and GART growth"

[[metric]]
name = "stall_gpu_s"
unit = "seconds"
better = "lower"
matrix = "when-set"
tool = "bench/analysis/report.py stall_gpu_s (bench/analysis/stalls.py; runs recorded with STALLS=1)"
what = "seconds of the window's stalls spent waiting on the GPU"

[[metric]]
name = "stall_cpu_s"
unit = "seconds"
better = "lower"
matrix = "when-set"
tool = "bench/analysis/report.py stall_cpu_s (bench/analysis/stalls.py; runs recorded with STALLS=1)"
what = "seconds of the window's stalls spent running, or runnable without a CPU"

[[metric]]
name = "stalls_play"
unit = "frames"
better = "lower"
matrix = "when-set"
tool = "bench/analysis/report.py stalls_play (the game's [reload] in benchmark/analysis.toml)"
what = "stalls over the gameplay only: the window less the reload of a game that loops its demo; a game without a reload has the plain number"

[[metric]]
name = "stall_play_s"
unit = "seconds"
better = "lower"
matrix = "when-set"
tool = "bench/analysis/report.py stall_play_s"
what = "the seconds the gameplay (the window less the reloads) spent in frames over 100 ms"

[[metric]]
name = "low1_play"
unit = "frames a second"
better = "higher"
matrix = "when-set"
tool = "bench/analysis/report.py low1_play"
what = "the 1% low over the gameplay only"

[[metric]]
name = "longest_play_ms"
unit = "ms"
better = "lower"
matrix = "when-set"
tool = "bench/analysis/report.py longest_play"
what = "the longest frame of the gameplay only"

[[metric]]
name = "sound_faults_per_min"
unit = "faults a minute"
better = "lower"
matrix = "none"
tool = "tools/gamedb/import-run.py (a played session's sound faults); in the suite summary: underruns a minute, or a reading of the suite table's sound column where the log has no number"
what = "sound faults a minute, the number score.py's sound aspect scores"
