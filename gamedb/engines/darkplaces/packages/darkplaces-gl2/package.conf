# DarkPlaces 0~20180412~beta1 (Debian's buster source, the last snapshot before the GL 3.2 core
# renderpath replaced GL 1.1/1.3/2.0), built as /usr/games/darkplaces-gl2 beside Debian's darkplaces,
# so Nexuiz Classic (Debian's nexuiz-data) can run on the RSX (GL 2.1 max). See docs/GAME-PLAN.md.
# The Makefile passes the tarball's path (DP_ORIG, config.mk pins it); Debian's patches are ours now.
TYPE=upstream
SOURCE=darkplaces-gl2
UPVER=0~20180412~beta1
DEBREV=1
ORIG=$DP_ORIG
COMPONENTS=""
BUILD=native
