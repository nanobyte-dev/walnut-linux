# ioquake3's analysis rules: every game on the engine (its build.toml engine = "ioquake3") shares them,
# before its own benchmark/analysis.toml (bench/gamedata.py; gamedb/README.md "engines/<e>/").

[[log_ignore]]
re = 'Client Shutdown \(Received signal 15\)'
why = "Quake 3 engines report the harness's SIGTERM at the end of the run"

[[log_strip]]
# removed from each log line before messages are compared (logscan.py)
re = '\^[0-9a-z]'
why = "Quake colour codes"
