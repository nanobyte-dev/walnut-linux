# Debian source package this directory patches (tools/deb-fetch.sh, deb-prepare.sh, deb-build.sh).
# ioquake3 is OpenArena's engine (/usr/games/openarena runs it); our patches 0001-0010 cut the memory its
# GLSL renderer (renderer_opengl2, cl_renderer opengl2) holds on the PS3, 0011-0018 the CPU time the
# engine and renderer_opengl1 use (shader script lookups, pk3 reads, AltiVec, startup), 0019-0022 the
# GL calls and draws renderer_opengl1 makes per frame (lightmap atlas, deferred texture unit and
# array state, no compiled vertex array locks, the sky box from vertex arrays), 0023 switches that
# tell the atlas textures from the batching (r_mergeLightmaps 2, r_mergeLightmapsSize), 0024 the atlas
# off by default (it adds about 10 s of hitches per run on the PS3), 0025-0026 the loads during
# play and at a reload of the same map (r_keepImages: textures kept across a map change;
# cl_preloadLate: what the cgame registered during play, players joining, loaded with the next
# load of the same map; cl_deferPlayers, opt-in), 0027-0029 renderer_opengl2's memory and load CPU on
# nv30 (r_vaoSnormColor: colours in a vertex format the RSX fetches, so Mesa keeps no system memory
# copies of the VBOs; mipmaps without powf; r_md3PackedFrames, opt-in: model frames in 12 bytes), 0030
# cl_cdkeyCheck 0: Quake III's menus take any CD key as valid (no CD KEY screen at every start), 0031
# sys_signalQuit 1: SIGTERM and the other quit signals end the game from the main loop, not from
# inside the signal handler (which hung the shutdown on libxcb's lock).
TYPE=debsrc
SOURCE=ioquake3
VERSION=1.36+u20260719.58839361+dfsg-1
