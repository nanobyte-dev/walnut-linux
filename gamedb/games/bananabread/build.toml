# How BananaBread is built, installed and integrated (gamedb/README.md "build.toml").
packages = ["cube2", "cube2-data"]
engine = "cube2"
suite = "none"
needs_data = false
# the models and sounds Debian's cube2-data leaves out (the licensed suite only)
data = ["sauerbraten-nonfree-data"]
recipes = ["bananabread:base"]

[[licensed]]
name = "sauerbraten-nonfree-data"
builder = "source"
# X-Walnut-Edition and X-Walnut-Release (its debian/control says the same)
edition = "full"
release = "2020_12_29"
