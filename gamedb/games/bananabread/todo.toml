source = "backlog/games.md rank 42"
text = """\
`texreduce 1` (recipe variant `tex1`, no row yet): it holds 117 MB of VRAM (rows 68-70), about 87 MB \
of it textures; DDS and JPG at a quarter would take 45-60 MB off, blurrier (the user decides). The \
fallback if texture compression at upload takes little here (cube2 already compresses from 1024 up)."""

