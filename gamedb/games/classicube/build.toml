# How ClassiCube is built, installed and integrated (gamedb/README.md "build.toml").
packages = ["classicube"]
# its textures and sounds are licensed
suite = "licensed"
data = ["classicube-data"]

[[licensed]]
name = "classicube-data"
builder = "source"
# X-Walnut-Edition (its debian/control says the same; no release: the texture pack and sounds are unversioned)
edition = "full"
