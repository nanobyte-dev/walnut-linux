# Native package: this directory is the source (tools/deb-prepare.sh, deb-build.sh).
# Dungeon Crawl Stone Soup's start on Walnut: Debian's crawl-tiles, fullscreen, with the map and
# database caches made at build time. A fresh home spent 2-3 minutes on "Loading maps..." (the PS3's
# PPE compiling the 143 .des vault files through Lua; 7 s on a PC), so the cache that run would write
# into ~/.crawl/saves is built here, by Debian's console crawl under qemu against the very
# crawl-common the console installs, and copied into the home before the game starts.
# BUILD=native: the cache is made by running crawl, a ppc64 program (the build dependency), and it
# records the byte order (a PC's cache is refused on the PS3).
TYPE=native
SOURCE=crawl-walnut
BUILD=native
