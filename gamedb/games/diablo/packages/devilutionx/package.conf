# Upstream source: DevilutionX 1.5.5, the Diablo (1996) and Hellfire engine (not in Debian). The Makefile
# downloads upstream's offline source release, devilutionx-src.tar.xz (gamedb/games/diablo/packages/devilutionx/upstream.mk):
# it carries the dependencies CMake would otherwise fetch (dist/: asio, libmpq, libsmackerdec, SDL_audiolib,
# simpleini, libzt) and a pre-built devilutionx.mpq (the engine's own UI art, fonts and translations), so the
# build needs no network and no smpq. SDL2, SDL2_image, fmt, libsodium, zlib and bzip2 come from Debian.
# ZeroTier, Discord and the tests are off; TCP multiplayer stays. No game data: DIABDAT.MPQ (or the
# shareware spawn.mpq) is the player's. patches/: our fixes (big-endian audio output format).
TYPE=upstream
SOURCE=devilutionx
UPVER=1.5.5
DEBREV=1
ORIG=$DVX_ORIG
COMPONENTS=
BUILD=native
