# Debian source package this directory patches (tools/deb-fetch.sh, deb-prepare.sh, deb-build.sh).
# Endless Sky 0.11.2 on the PS3 (docs/research/ENDLESS-SKY.md): big-endian fixes (premultiplied alpha,
# collision masks, font kerning, WAV samples), mono sounds kept mono (expanded at playback), mallopt at
# the start of main(), the game's own GL2 path with GLSL 1.20 shaders, a 2D sprite atlas instead of
# 3D textures (nv30 cannot, and Mesa 0038 only compresses 2D power-of-two textures), the fog map as
# LUMINANCE8, a cheap outline fallback, and PS3 defaults (2 loader threads, deferred image loading).
