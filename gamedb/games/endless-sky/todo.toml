after Depart the starfield, radar, status bars, date and credits, no \"out of temps\" (if not: \
variants `fullout`, `noblur`, `ENVS=\"- NV30_FORCE_DXT=off\"`, one at a time), then fps, stalls and \
smoothness in flight. Install with `make deploy PKGS=\"endless-sky endless-sky-data\"` (the user at \
the PS3 or with the OK)."""
