# How Heretic is built, installed and integrated (gamedb/README.md "build.toml").
# DSDA-Doom (the dsda-doom bundle); the WAD from the player's own copy
packages = ["dsda-doom"]
suite = "none"
needs_data = true

[data_setup]
gdp = "heretic"
required = ["heretic-wad"]
hint = "HERETIC.WAD from Heretic: Shadow of the Serpent Riders (1.3) or the original 1.0 release: a CD, an installed copy, Steam's folder or the GOG installer."
# what each package holds (X-Walnut-Edition of the package import-data builds)
editions = { "heretic-wad" = "full" }
