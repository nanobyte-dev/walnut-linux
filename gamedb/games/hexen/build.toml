# How Hexen: Beyond Heretic is built, installed and integrated (gamedb/README.md "build.toml").
# DSDA-Doom (the dsda-doom bundle, which puts it in ps3-games); the WAD from the player's own copy
packages = ["dsda-doom"]
suite = "none"
needs_data = true

[data_setup]
gdp = "hexen"
original = "Hexen"
required = ["hexen-wad"]
hint = "HEXEN.WAD from Hexen: Beyond Heretic 1.1 (1.0 does not run): a CD, an installed copy or Steam's common/Hexen folder."
# what each package holds (X-Walnut-Edition of the package import-data builds)
editions = { "hexen-wad" = "full" }
