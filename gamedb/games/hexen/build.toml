# How Hexen: Beyond Heretic is built, installed and integrated (gamedb/README.md "build.toml").
# DSDA-Doom (the dsda-doom bundle); the WAD from the player's own copy
packages = ["dsda-doom"]
suite = "none"
needs_data = true

[data_setup]
gdp = "hexen"
original = "Hexen"
required = ["hexen-wad"]
# Deathkings of the Dark Citadel (HEXDD.WAD), sold apart: its own launcher, Hexen plays without it
optional = ["hexen-deathkings-wad"]
hint = "HEXEN.WAD from Hexen: Beyond Heretic 1.1 (1.0 does not run): a CD, an installed copy, Steam's common/Hexen folder or GOG's installer; HEXDD.WAD from Deathkings of the Dark Citadel if you have it."
# what each package holds (X-Walnut-Edition of the package import-data builds)
editions = { "hexen-wad" = "full", "hexen-deathkings-wad" = "expansion" }
