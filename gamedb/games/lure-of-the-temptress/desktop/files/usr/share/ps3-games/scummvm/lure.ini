# Walnut's ScummVM defaults for Lure of the Temptress (ps3-games-integration, from gamedb/games/lure-of-the-temptress/desktop/files).
# Its menu entries start ScummVM with -c ~/.config/scummvm/walnut/lure.ini -i this file: ScummVM reads
# this one only while that file doesn't exist yet, then the player's settings for the game live there.
# Console defaults: fullscreen with the picture's shape kept, ScummVM's own file browser (the desktop's
# dialog would open in the desktop that game mode freezes), no quit question, subtitles, AdLib music at
# 22050 Hz (cheap on the PS3's CPU). The pad is the mouse by ScummVM's default (joystick_num 0).
[scummvm]
fullscreen=true
stretch_mode=fit
gui_browser_native=false
confirm_exit=false
gui_return_to_launcher_at_exit=false
subtitles=true
music_driver=adlib
output_rate=22050

# the game, a target of its own: its settings are kept (ScummVM saves no target it makes from a bare game
# id) and the name is never ambiguous (atlantis alone matches another engine's game too)
[lure]
gameid=lure
engineid=lure
description=Lure of the Temptress
