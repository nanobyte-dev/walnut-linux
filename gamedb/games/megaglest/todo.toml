[[item]]
kind = "benchmark"
added = 2026-10-29
source = "worker-thread check 2026-10-29 (gamedb:batch/2026-10-29-worker-threads)"
text = """\
Two settings that don't change the picture, A/B on the scenario (`--load-scenario=amazones`, \
3 rounds, same boot, STALLS=1): `EnableFTPServer=false` (its FTPServerThread took 4% of the CPU serving map \
transfers nobody asks for in a local game) and `EnableNewThreadManager=true` (the main thread waits for the \
faction threads on semaphores instead of spinning; technical.md "Threads in the stall frames"). A default \
in our glestuser.ini only if the stalls or the 1% low move."""
