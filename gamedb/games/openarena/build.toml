# How OpenArena is built, installed and integrated (gamedb/README.md "build.toml").
packages = ["openarena"]
engine = "ioquake3"
suite = "free"
needs_data = false
divert = ["/usr/share/applications/openarena.desktop"]
# in the image's package layer (system/image/packages.txt)
image_base = true
recipes = ["openarena:gl2min", "openarena:base"]
