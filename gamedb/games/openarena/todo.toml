[[item]]
kind = "fix"
added = 2026-10-19
source = "PLAN 3.7"
text = """\
renderergl2 has no `r_keepImages` (ioquake3 0025 is opengl1's), so every demo pass and map change \
reloads, decodes and mipmaps every texture: `R_MipMapsRGB` was 7.8% of a profiled window with three \
reloads, `COM_ParseExt` (the .shader scripts, at every load) 2.8%."""

[[item]]
kind = "fix"
added = 2026-10-19
source = "PLAN 3.7"
text = """\
After a map load, `madvise(MADV_DONTNEED)` on the page-aligned gap between `hunk_low.temp` and \
`s_hunkTotal - hunk_high.temp` in `s_hunkData` (code/qcommon/common.c, next to `Com_TouchMemory`), \
behind a cvar `com_hunkTrim` (default 0): 2.7 MB in opengl1. Its RAM is still the lowest of the \
suite (9-20 MB free at the lowest, rows 68-70)."""

