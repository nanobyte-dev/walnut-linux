# How OpenRCT2 is built, installed and integrated (gamedb/README.md "build.toml").
# packages/openrct2: our big-endian port (openrct2 pulls openrct2-data, recommends openrct2-music)
packages = ["openrct2"]
# Walnut Games installs it
suite = "none"
needs_data = true
# RollerCoaster Tycoon 2's data: game-data-packager's package (in /usr/share/games/roller-coaster-tycoon2),
# then the licensed suite's older rct2-data (/usr/share/games/rct2)
data = ["roller-coaster-tycoon2-data", "rct2-data"]

[[licensed]]
# game-data-packager's package from the owner's CD image or folder (make licensed-data
# PKG=roller-coaster-tycoon2-data INPUT=<image or folder>); the same name and files the console's import makes
name = "roller-coaster-tycoon2-data"
builder = "game-data-packager:roller-coaster-tycoon2"
input = true

[[licensed]]
# our own script's package from the CD (/usr/share/games/rct2, 1.0-2 the last), built no more: its
# published files stay, and the console counts it as the game's data (present_any)
name = "rct2-data"
builder = "retired"
edition = "full"

[data_setup]
gdp = "roller-coaster-tycoon2"
original = "RollerCoaster Tycoon 2"
required = ["roller-coaster-tycoon2-data"]
# Wacky Worlds and Time Twister (in /usr/share/games/roller-coaster-tycoon2, beside the base game): from
# a Triple Thrill Pack CD, install or GOG installer; without them OpenRCT2 lacks their scenarios and objects
optional = ["roller-coaster-tycoon2-wacky-worlds-time-twister-data"]
hint = "RollerCoaster Tycoon 2: its CD, an installed copy (Steam, GOG) or the GOG installer."
# what each package holds (X-Walnut-Edition of the package import-data builds)
editions = { "roller-coaster-tycoon2-data" = "full", "roller-coaster-tycoon2-wacky-worlds-time-twister-data" = "expansion" }
