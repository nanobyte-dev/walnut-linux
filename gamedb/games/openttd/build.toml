# How OpenTTD is built, installed and integrated (gamedb/README.md "build.toml").
packages = ["openttd", "openttd-opengfx", "openttd-opensfx", "openttd-openmsx"]
suite = "free"
needs_data = false
divert = ["/usr/share/applications/openttd.desktop"]
recipes = ["openttd:base"]

[data_setup]
# Transport Tycoon Deluxe's original graphics, sounds and music (the Windows version's files) in place of
# OpenGFX, OpenSFX and OpenMSX: the game runs without them. The music comes in two arrangements, the CD's
# gm/ (General MIDI: -music, OpenTTD's original_windows set) and fm/ (FM synthesizer: -music-fm, with our
# gdp's own set original_windows_fm); a copy may have either or both
gdp = "ttd"
original = "Transport Tycoon Deluxe"
required = []
optional = ["transport-tycoon-deluxe-data", "transport-tycoon-deluxe-music", "transport-tycoon-deluxe-music-fm"]
hint = "Transport Tycoon Deluxe for Windows: its CD or an installed copy (the trg*.grf files, sample.cat and the music, gm_tt*.gm or fm/9_tt*.fm)."
# what each package holds (X-Walnut-Edition of the package import-data builds)
editions = { "transport-tycoon-deluxe-data" = "full", "transport-tycoon-deluxe-music" = "music", "transport-tycoon-deluxe-music-fm" = "music" }
