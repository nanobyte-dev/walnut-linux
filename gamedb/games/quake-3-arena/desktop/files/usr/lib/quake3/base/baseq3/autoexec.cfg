// Walnut's PS3 defaults for Quake III Arena (gamedb:quake-3-arena), as OpenArena's on the same engine
// no CD KEY screen at every start (ioquake3 0030; the key mattered only to id's authorize servers)
seta cl_cdkeyCheck "0"
seta cl_renderer "opengl1"
seta r_mode "-2"
seta r_fullscreen "1"
seta r_swapInterval "1"
seta com_maxfps "60"
// DXT1 for opaque textures: VRAM left for the VRAM swap (OpenArena: 11-14 MB less)
seta r_ext_compressed_textures "1"
seta in_joystick "1"
seta in_joystickUseAnalog "1"
bind PAD0_RIGHTTRIGGER "+attack"
bind PAD0_LEFTTRIGGER "+zoom"
bind PAD0_A "+moveup"
bind PAD0_B "+movedown"
bind PAD0_RIGHTSHOULDER "weapnext"
bind PAD0_LEFTSHOULDER "weapprev"
bind PAD0_X "+button2"
bind PAD0_START "togglemenu"
bind PAD0_BACK "+scores"
