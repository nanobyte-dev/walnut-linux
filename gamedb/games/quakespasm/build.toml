# How QuakeSpasm is built, installed and integrated (gamedb/README.md "build.toml").
packages = ["quakespasm"]
# its data is licensed: kept out of the public image (tools/image-packages.sh)
suite = "licensed"
needs_data = true
data = ["quake-shareware"]
divert = ["/usr/share/applications/net.sourceforge.quakespasm.Quakespasm.desktop"]	# Debian 0.96.3 names its entry so (quakespasm.desktop before)
recipes = ["quakespasm:base"]

[[licensed]]
# Quake's shareware data (game-data-packager: Section non-free/games; make game-data)
name = "quake-shareware"
builder = "game-data-packager:quake"
leak_files = ["*id1/pak[0-9].pak"]

[data_setup]
gdp = "quake"
original = "Quake"
# quake-rerelease: the 2021 re-release (GOG's Quake Enhanced, build 60828) in a base directory of
# its own, /usr/share/games/quake-rerelease, with its own launcher (it can't stand in for the original paks)
required = ["quake-shareware", "quake-registered", "quake-rerelease"]
# the CD's music as Ogg Vorbis (CD audio tracks 2-11): encoded from a BIN/CUE's audio tracks or ripped
# from the disc in the drive (game-data-packager runs cdparanoia); no checksums, see PACKAGING.md
# quake-rerelease-*: the re-release's own builds of Scourge of Armagon and Dissolution of Eternity (with
# their music), Dimensions of the Past and Dimension of the Machine, from the same GOG installer, in
# quake-rerelease's folder (-game hipnotic, rogue, dopa, mg1; each its own launcher)
optional = ["quake-music", "quake-rerelease-armagon", "quake-rerelease-dissolution", "quake-rerelease-dopa", "quake-rerelease-dimension-of-the-machine"]
# a 1.01 CD's id1/pak0.pak needs 1.06's, which game-data-packager takes from the shareware download
downloads = ["quake-registered"]
# the shareware gdp fetches by itself (quake106.zip): no SOURCE needed
fetch = ["quake-shareware"]
hint = "Quake's id1/pak0.pak and id1/pak1.pak: its CD or a BIN/CUE image of it (with the CD music), an installed copy (Steam, GOG) or GOG's installer. The 2021 re-release: GOG's Quake Enhanced installer, build 60828 (setup_quake_enhanced_1.0_(60828).exe), or that build installed (with its mission packs and episodes)."
# what each package holds (X-Walnut-Edition of the package import-data builds)
editions = { "quake-shareware" = "shareware", "quake-registered" = "full", "quake-music" = "music", "quake-rerelease" = "remaster", "quake-rerelease-armagon" = "expansion", "quake-rerelease-dissolution" = "expansion", "quake-rerelease-dopa" = "expansion", "quake-rerelease-dimension-of-the-machine" = "expansion" }
