# How Sauerbraten is built, installed and integrated (gamedb/README.md "build.toml").
packages = ["sauerbraten-walnut", "cube2"]
# up to 0.874 the launcher was sauerbraten, Debian's name (docs/PACKAGING.md); older sessions recorded it so
former_packages = ["sauerbraten"]
engine = "cube2"
suite = "none"
needs_data = true
data = ["sauerbraten-data"]
desktop = ["sauerbraten.desktop"]
recipes = ["sauerbraten:base"]

[[licensed]]
name = "sauerbraten-data"
builder = "source"
# X-Walnut-Edition and X-Walnut-Release (its debian/control says the same)
edition = "full"
release = "2020_12_29"
