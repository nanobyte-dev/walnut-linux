# Native package: this directory is the source (tools/deb-prepare.sh, deb-build.sh).
# Sauerbraten's launcher, named sauerbraten-walnut so Debian's own sauerbraten (non-free:
# its data and launcher) keeps its name and version (docs/PACKAGING.md "Our version never changes the
# original's"; 0.874 and older were published as sauerbraten). the engine is our cube2 package (Debian's cube2 is Sauerbraten's own engine,
# the 2020_12_29 source with later svn fixes, plus our patches), the data is sauerbraten-data (licensed).
TYPE=native
SOURCE=sauerbraten-walnut
BUILD=indep
