# Walnut's defaults for ScummVM's own launcher (ps3-games-integration, from gamedb/games/scummvm/desktop/files).
# Its menu entry starts ScummVM with -i this file: ScummVM reads it only while ~/.config/scummvm/scummvm.ini
# doesn't exist yet. The entry runs without game mode (PS3_GAME_MODE=off, X-Walnut-GameMode=false): the
# launcher is a desktop program, and games started from it get no game mode either; Walnut's own entries
# for each game start it directly instead. gui_browser_native=false: Add Game uses ScummVM's own file
# browser, not the desktop's dialog.
[scummvm]
fullscreen=true
stretch_mode=fit
gui_browser_native=false
confirm_exit=false
subtitles=true
music_driver=adlib
output_rate=22050
