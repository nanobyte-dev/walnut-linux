[[item]]
kind = "research"
added = 2026-10-19
source = "PLAN 2.1"
text = """\
Does it sound right, by ear? The device is RUNNING since the SSD root (the old `sound=none` was read \
before the game opened its device), but OpenAL logs \"Wait timeout... buffer size too low?\" 83-244 \
times in half the runs and the webcam mic heard only the room in 14 of 17 clips. Decision D4 (`lean` \
as the package default) waited on it; package 0006 now ships lean defaults. Start it from the \
desktop as a player would and listen; if it is silent outside profile mode too, OpenAL Soft's log \
(`ALSOFT_LOGLEVEL`) and an strace of the device open say which side fails."""

[[item]]
