# How Yamagi Quake II is built, installed and integrated (gamedb/README.md "build.toml").
packages = ["yamagi-quake2", "yamagi-quake2-core"]
# ps3-games names only the game; the rest comes with it
meta = ["yamagi-quake2"]
# in ps3-games, not in the public ps3-games-free: its data is licensed
suite = "licensed"
needs_data = true
data = ["quake2-demo-data"]
recipes = ["yquake2:kiss4k"]

[[licensed]]
# Quake II's demo data (game-data-packager: Section local/games, not redistributable at all; make game-data)
name = "quake2-demo-data"
builder = "game-data-packager:quake2"
leak_files = ["*baseq2/pak[0-9].pak"]

[data_setup]
gdp = "quake2"
required = ["quake2-demo-data", "quake2-full-data"]
# the 3.20 patch's files (pak1, pak2 and more), downloaded when the copy isn't patched
downloads = ["quake2-full-data"]
hint = "Quake II's baseq2/pak0.pak and baseq2/video: its CD, an installed copy (Steam, GOG) or GOG's installer."
