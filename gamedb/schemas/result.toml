# A played session's record (rating/sessions/<run>/result.toml), generated by tools/gamedb/import-run.py
# from the session's evidence alone (do not edit; reimport.py derives it again). Rules-1 records (no rules
# key) are frozen as an older importer wrote them. check.py checks the rest: game is the folder's game, the
# listed screenshots exist, a data-version-2 record's defects name known categories.
kind = "result"
title = "A played session's record (result.toml)"
doc = "gamedb/README.md#gamesidrating"
paths = ["gamedb/games/*/rating/sessions/*/result.toml"]
format = "toml"

[keys.schema]
type = "int"
required = true
enum = [1]
meaning = "the record's format version"

[keys.rules]
type = "str"
pattern = '\d+\.\d+'
meaning = "\"<data>.<formula>\": the data version the record holds (absent: a frozen rules-1 record)"

[keys.kind]
type = "str"
required = true
enum = ["session", "demo", "capture", "script"]
meaning = "a played session, a demo, a capture or a scripted run"

[keys.date]
type = "str"
required = true
pattern = '\d{4}-\d{2}-\d{2}'
meaning = "the run's UTC date"

[keys.run]
type = "str"
required = true
nonempty = true
meaning = "the harness run directory's name"

[keys.game]
type = "str"
required = true
pattern = '[a-z0-9][a-z0-9-]{0,63}'
meaning = "the game's id (the folder's game)"

[keys.variant]
type = "str"
required = true
meaning = "the recipe variant"

[keys.launcher]
type = "str"
required = true
meaning = "the menu launcher the session started"

[keys.source]
type = "str"
enum = ["submitted"]
meaning = "submitted: a tester's session (absent: one of ours)"

[keys.tester]
type = "str"
pattern = '[^\x00-\x1f\x7f]{1,40}'
only_when = { source = "submitted" }
meaning = "the tester's nickname, 1 to 40 characters (only with source)"

[keys.play_seconds]
type = "number"
required = true
min = 0
meaning = "seconds of play"

[keys.end]
type = "str"
required = true
meaning = "how the run ended (quit, crash, timeout, ...)"

[keys.crashed]
type = "bool"
required = true
meaning = "the game crashed"

[keys.started]
type = "bool"
required = true
meaning = "the game started"

[keys.reached_play]
type = "bool"
required = true
meaning = "the game reached play"

[keys.render]
type = "str"
required = true
pattern = '\d+x\d+'
meaning = "the screen's resolution"

[keys.numbers]
type = "table"
required = true
meaning = "the numbers the record derives from the evidence (a closed set)"

[keys.numbers.keys.median_fps]
type = "number"
meaning = "the median frame rate in play (HUD frame times)"

[keys.numbers.keys.low1_fps]
type = "number"
meaning = "the 1% low in play"

[keys.numbers.keys.stutter_s_per_min]
type = "number"
meaning = "seconds of long frames a minute of play"

[keys.numbers.keys.stutter_local_s_per_min]
type = "number"
meaning = "the same, frames long against their neighbours"

[keys.numbers.keys.longest_ms]
type = "number"
meaning = "the longest frame in play, ms"

[keys.numbers.keys.frames]
type = "int"
meaning = "frames counted in play"

[keys.numbers.keys.sound_faults_per_min]
type = "number"
meaning = "sound faults a minute"

[keys.numbers.keys.sound_faults]
type = "int"
meaning = "sound faults (dropouts and stalls) in play"

[keys.numbers.keys.sound_dropouts]
type = "int"
meaning = "audible dropouts the recorder found"

[keys.numbers.keys.sound_dropouts_per_min]
type = "number"
meaning = "the same a minute"

[keys.numbers.keys.sound_dropouts_at_shots]
type = "int"
meaning = "dropouts at a screenshot (the capture's own, not counted)"

[keys.numbers.keys.xruns]
type = "int"
meaning = "ALSA xruns in play"

[keys.numbers.keys.xrun_gap_ms]
type = "number"
meaning = "the longest xrun gap, ms"

[keys.numbers.keys.snd_stall]
type = "int"
meaning = "sound card stalls"

[keys.numbers.keys.sound_effects]
type = "str"
meaning = "the form's sound answer"

[keys.numbers.keys.music]
type = "str"
meaning = "the form's music answer"

[keys.numbers.keys.display_samples]
type = "int"
meaning = "window geometry samples taken"

[keys.numbers.keys.geometry]
type = "list"
items = "str"
meaning = "the window geometry samples (`x y w h fullscreen screen_w screen_h`)"

[keys.numbers.keys.pointer_samples]
type = "int"
meaning = "samples that could see the pointer"

[keys.numbers.keys.pointer_visible]
type = "int"
meaning = "of those, the pointer over the game"

[keys.numbers.keys.lit_shots]
type = "int"
meaning = "screenshots with a picture"

[keys.numbers.keys.bars_shots]
type = "int"
meaning = "of those, with black bars"

[keys.numbers.keys.bars]
type = "str"
meaning = "a frozen record's bars answer"

[keys.numbers.keys.bars_content]
type = "str"
meaning = "a frozen record's bars note"

[keys.numbers.keys.input_log]
type = "bool"
meaning = "the run logged input"

[keys.numbers.keys.kb_readable]
type = "bool"
meaning = "the keyboard's events were readable"

[keys.numbers.keys.kb_presses]
type = "int"
meaning = "key presses in play"

[keys.numbers.keys.pads_present]
type = "int"
meaning = "gamepads present"

[keys.numbers.keys.pad_opened]
type = "bool"
meaning = "the game opened a gamepad"

[keys.numbers.keys.pad_events_play]
type = "int"
meaning = "gamepad events in play"

[keys.numbers.keys.pads_hotplugged]
type = "int"
meaning = "gamepads plugged in during the run"

[keys.numbers.keys.pads_hotplug_opened]
type = "int"
meaning = "of those, opened by the game"

[keys.numbers.keys.fresh_home]
type = "int"
meaning = "fresh-home directories set aside"

[keys.numbers.keys.fresh_home_new]
type = "int"
meaning = "of those, created by the game"

[keys.numbers.keys.recovered]
type = "int"
meaning = "GPU recoveries in the run"

[keys.numbers.keys.load_s]
type = "number"
meaning = "seconds from the start to play"

[keys.numbers.keys.load_level_s]
type = "number"
meaning = "seconds of level loads during play"

[keys.numbers.keys.level_loads]
type = "int"
meaning = "level loads during play"

[keys.numbers.keys.min_avail_kb]
type = "int"
meaning = "the lowest MemAvailable, kB"

[keys.numbers.keys.rss_mib]
type = "number"
meaning = "the game's peak RSS, MiB"

[keys.numbers.keys.shot_points]
type = "int"
meaning = "screenshots the verdict covers"

[keys.numbers.keys.shot_differing]
type = "int"
meaning = "of those, differing from the PC reference"

[keys.numbers.keys.desktop_back_s]
type = "number"
meaning = "seconds the desktop took to come back after the game"

[keys.numbers.keys.desktop_stuck]
type = "bool"
meaning = "the desktop did not come back"

[keys.numbers.keys.render_res]
type = "str"
meaning = "the game's render resolution when it differs from the screen's"

[keys.scores]
type = "table"
meaning = "a frozen rules-1 record's aspect scores (data version 2 records are scored at catalog time)"

[keys.scores.keys.frame]
type = "number"
meaning = "the frame rate score"

[keys.scores.keys.smooth]
type = "number"
meaning = "the smoothness score"

[keys.scores.keys.sound]
type = "number"
meaning = "the sound score"

[keys.scores.keys.load]
type = "number"
meaning = "the load time score"

[keys.scores.keys.picture]
type = "number"
meaning = "the picture score"

[keys.versions]
type = "table"
required = true
other = "str"
other_keys = '[a-z0-9][a-z0-9+.-]*'
meaning = "the versions the run recorded: the game's packages, the driver stack, the kernel, walnut's release"

[keys.data]
type = "table"
other_keys = '[a-z0-9][a-z0-9+.-]*[a-z0-9]'
meaning = "the game's data packages the run had: `<pkg> = { version, edition, release }`"

[keys.data.other]
type = "table"

[keys.data.other.keys.version]
type = "str"
meaning = "the package's version"

[keys.data.other.keys.edition]
type = "str"
meaning = "its X-Walnut-Edition"

[keys.data.other.keys.release]
type = "str"
meaning = "its X-Walnut-Release"

[keys.picture]
type = "table"
meaning = "the picture verdict"

[keys.picture.keys.verdict]
type = "str"
enum = ["ok", "minor", "wrong"]
meaning = "the review's verdict"

[keys.picture.keys.note]
type = "str"
meaning = "the verdict's note"

[keys.shots]
type = "table"
required = true
meaning = "the gallery"

[keys.shots.keys.ps3]
type = "list"
items = { type = "str", pattern = 'shots/[A-Za-z0-9._-]+\.jpg' }
meaning = "the pictures the site and the app show, paths in the folder (`shots/ps3-60s.jpg`)"

[keys.form]
type = "table"
meaning = "data version 2: the form's checklist answers (form.toml)"

[keys.form.keys.glitches]
type = "str"
meaning = "the form's glitches answer"

[keys.form.keys.pad_menus]
type = "str"
meaning = "the form's pad_menus answer"

[keys.form.keys.pad_play]
type = "str"
meaning = "the form's pad_play answer"

[keys.form.keys.keyboard_mouse]
type = "str"
meaning = "the form's keyboard_mouse answer"

[keys.form.keys.menus_modes]
type = "str"
meaning = "the form's menus_modes answer"

[keys.form.keys.saves_load]
type = "str"
meaning = "the form's saves_load answer"

[keys.review]
type = "table"
meaning = "data version 2: the review's answers (review.md)"

[keys.review.keys.stretched]
type = "str"
enum = ["yes", "no"]
meaning = "the picture stretched or squashed"

[keys.review.keys.stretched_where]
type = "str"
meaning = "where"

[keys.review.keys.text_px]
type = "int"
meaning = "the smallest text's height at 1080p, px"

[keys.review.keys.text_px_none]
type = "bool"
meaning = "the game shows no text"

[keys.review.keys.text_where]
type = "str"
meaning = "where that text is"

[keys.review.keys.pointer]
type = "str"
enum = ["visible", "hidden"]
meaning = "a pointer over the game"

[keys.review.keys.defects]
type = "list"
items = "str"
meaning = "the defects, `<category> <pc|ps3>: <what>`"

[keys.review.keys.broken]
type = "list"
items = "str"
meaning = "what was broken, `<item> <pc|ps3>: <what>`"

[keys.review.keys.checks]
type = "list"
items = "str"
meaning = "checklist answers the reviewer corrected, `<item> <answer>`"
