# The Walnut Games tags (gamedb/README.md "Tags"): every tag a game can have, in groups, some with subgroups.
#
# [[group]]: id, label, optional description, optional collapsed (the catalog filter shows the group folded).
#   [[group.tag]]: id (unique across all groups; it is the tag page's URL, tags/<id>/), label, optional
#   description, optional sub (the subgroup's tags: a game tagged with one of them has its parent too, the
#   way a first-person shooter is a shooter), optional automatic (true: catalog.py derives it from other facts
#   and index.md never lists it: check.py refuses it there).
# A game's index.md lists the tags that aren't automatic in `tags = [...]`, by id, the most specific one of a
# subgroup only ("fps", not "shooter" and "fps"); a published game has at least one genre.
# Read by tools/gamedb/check.py (validates the file and every game's tags), catalog.py (the tags of each game
# with the automatic and implied ones, and the groups for the site: tag pages, the filter panel).

[[group]]
id = "genre"
label = "Genre"

[[group.tag]]
id = "shooter"
label = "shooter"
sub = [
  { id = "fps", label = "first-person", description = "Shoot from the character's eyes." },
  { id = "arena", label = "arena", description = "Fast deathmatch rounds on small maps." },
]

[[group.tag]]
id = "strategy"
label = "strategy"
sub = [
  { id = "rts", label = "real-time", description = "Build a base and command units without turns." },
  { id = "management", label = "management", description = "Run a park, a company or a city and keep it profitable." },
]

