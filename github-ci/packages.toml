# github-ci/packages.toml: which binary packages each package may publish, and its trust tier.
# Read by the publisher (github-ci/batch-publish.py) from a trusted checkout at the run's head_sha,
# by the build's drift check (github-ci/build-package.sh) and by gen-workflows.py. Generated from the
# live indices and package.conf / debian/control on 2026-11-02; edited by hand from here on, in the
# commit that adds a name (see docs/PACKAGING.md).
#
#   dir       the package's directory (checked against tools/pkg-dir.sh)
#   source    the Source: field of every deb the build makes
#   tier      trusted | external | licensed (licensed: never built or published by CI)
#   binaries  Package: names the build may publish: literal, or with @RELEASE@ (6.12.111+ps3.N) and
#             @STAMP@ (12 digits) for kernel-versioned names; <name>-dbgsym is implied for each
#   retired   names the package no longer builds; still reserved for it, never published again
#   relations foreign names its debs may name in Replaces, Breaks, Conflicts, Provides (generated from the
#             indices; protected names such as libc6 or sudo can never be named, see protected-names.txt)
#   moved_from  Sources the entry's names may currently sit under in the suite (a listed move)
# Prefixes in [reserved] may only be published by their owner.
version = 1

[reserved]
"linux-image-" = "linux"
"linux-headers-" = "linux"
"linux-kbuild-" = "linux"
"ps3rsx-modules-" = "ps3rsx"

