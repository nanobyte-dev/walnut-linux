# Debian source package this directory patches (tools/deb-fetch.sh, deb-prepare.sh, deb-build.sh).
# ioquake3 is OpenArena's engine (/usr/games/openarena runs it); our patches 0001-0010 cut the memory its
# GLSL renderer (renderer_opengl2, cl_renderer opengl2) holds on the PS3, 0011-0018 the CPU time the
# engine and renderer_opengl1 use (shader script lookups, pk3 reads, AltiVec, startup), 0019-0022 the
# GL calls and draws renderer_opengl1 makes per frame (lightmap atlas, deferred texture unit and
# array state, no compiled vertex array locks, the sky box from vertex arrays), 0023 switches that
# tell the atlas textures from the batching (r_mergeLightmaps 2, r_mergeLightmapsSize), 0024 the atlas
# off by default (it adds about 10 s of hitches per run on the PS3).
TYPE=debsrc
SOURCE=ioquake3
VERSION=1.36+u20260719.58839361+dfsg-1
BUILD=native
