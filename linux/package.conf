# Debian source package (tools/deb-fetch.sh, deb-prepare.sh); the kernel is cross-built for ppc64
# here and linux-kbuild natively in the ppc64 chroot (tools/deb-build.sh, BUILD=cross-linux)
TYPE=debsrc
SOURCE=linux
VERSION=6.12.111-1
DSC_SHA256=6935287a25ed12865714b53cb936959db5875ee025abdaadea8df6335fe74d55
BUILD=cross-linux
# Our flavours: release (Debian flavour ps3: release 6.12.111+ps3.<N>, meta linux-image-ps3) and
# debug (Debian flavour ps3-debug: release 6.12.111+ps3.<N>-debug<stamp>, meta
# linux-image-ps3-debug); packaging/: debian/config/ppc64/defines.toml. Each one's full .config is
# made by tools/linux-config.sh at source-package time: DEFCONFIG plus the config/ fragments of
# FRAGMENTS_<flavour>, merged in order; flavours/<flavour>.args are its boot arguments.
FLAVOURS="release debug"
DEBIAN_FLAVOUR_release=ps3
DEBIAN_FLAVOUR_debug=ps3-debug
DEFCONFIG=ps3_defconfig
FRAGMENTS_release="ps3.config ps3-release.config"
FRAGMENTS_debug="ps3.config"
# Build profiles (tools/deb-build.sh): the cross build makes the images, headers and metas; the
# native one (ppc64 chroot) only linux-kbuild
CROSS_PROFILES=cross,nopython,nodoc,pkg.linux.nosource,pkg.linux.notools,pkg.linux.nokerneldbg
NATIVE_PROFILES=pkg.linux.nokernel,pkg.linux.mintools,nopython,nodoc,pkg.linux.nosource
