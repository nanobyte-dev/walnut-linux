# Debian source package this directory patches (tools/deb-fetch.sh, deb-prepare.sh, deb-build.sh).
# SFML 3.1 (libsfml-audio3.1, used by Extreme Tux Racer) opens its playback device with a 64 frame
# period, a 4 ms buffer that the PS3's PPE misses all the time; ours is 1024 frames, with an
# SFML_AUDIO_PERIOD_FRAMES override (patch 0001).
TYPE=debsrc
SOURCE=libsfml
VERSION=3.1.0+dfsg-4
BUILD=native
