# Upstream source (Debian has no badwolf): Badwolf 1.4.0, a small GTK 3 browser on WebKitGTK's 4.1 API,
# with our patches (patches/: one web context and web process for every tab, hardware acceleration
# off and the other memory defaults, JavaScript on, "Walnut" in the User-Agent, search and a start page,
# the common shortcuts, other schemes to the desktop). Walnut's web browser; WebKitGTK itself is
# Debian's (libwebkit2gtk-4.1-0 2.52.6 on ppc64). The Makefile downloads the pinned release
# (packages/patched/desktop/badwolf/upstream.mk) and passes the path as BADWOLF_ORIG. CHECK=1: upstream's
# unit tests (uri, fmt, bookmarks) run in the build.
TYPE=upstream
SOURCE=badwolf
UPVER=1.4.0
DEBREV=1
ORIG=$BADWOLF_ORIG
COMPONENTS=
BUILD=native
CHECK=1
