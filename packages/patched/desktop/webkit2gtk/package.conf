# Debian source package this directory patches (tools/deb-fetch.sh, deb-prepare.sh, deb-build.sh)
# WebKitGTK 2.52.6, the last branch with a Cairo renderer (2.54 is Skia only, and Skia has no
# big-endian support): the GTK 3 (4.1 API) flavour only, for Badwolf, with the big-endian fixes
# Debian's ppc64 build lacks and the features we leave out (packaging/, docs/research/BROWSERS.md)
TYPE=debsrc
SOURCE=webkit2gtk
VERSION=2.52.6-1
DSC_SHA256=1487570ba4c88491757f411079ca0883b3979b2aff93fca12c72a2178bf65a52
# sid moved on to 2.54 on 2026-10-01; 2.52.6-1 is fetched from a snapshot where it was current
SOURCE_SNAPSHOT=20260925T000000Z
# Too big for a qemu build or a GitHub runner (a cross build would take ~10x less time than qemu-user,
# but 6 h and 14 GB on a 4-core runner are not enough either): built on the dev PC with the x86-64
# cross compiler inside the ppc64 chroot (tools/xcc-build.sh), never by CI (github-ci/gen-workflows.py)
BUILD=xcc
VERSION_PATHS="tools/xcc-build.sh build-containers/Dockerfile.xcc"
