// Lean Nexuiz settings for the PS3 (docs/GAME-PLAN.md): low memory first, then quality
// that costs nothing. vid_gl20 0 selects the GL 1.3 combiner renderpath (no GLSL programs for
// nv30 to compile); set it to 1 for the GL 2.0 path.
vid_gl20 0
gl_picmip 2
gl_picmip_world 0
gl_texturecompression 1
r_texture_dds_load 1
r_texture_dds_save 1
r_shadow_realtime_world 0
r_shadow_realtime_dlight 0
r_bloom 0
r_coronas 0
r_water 0
r_depthfirst 0
r_lerpmodels 1
cl_particles_quality 0.5
cl_decals 0
cl_decals_max 100
gl_texture_anisotropy 1
r_motionblur 0
r_glsl_deluxemapping 0
r_glsl_offsetmapping 0
// sound: mono 22 kHz 16-bit, no music
snd_channels 1
snd_width 2
snd_speed 22050
bgmvolume 0
