# Upstream source: OpenRCT2 0.5.6 (Debian's openrct2 is contrib, with Build-Depends
# architecture-is-little-endian) and our big-endian patch series (patches/: the byte-order core of the closed
# AmigaOS PR #27114 by Thomas Luebker, adapted, plus our fixes). The Makefile downloads the pinned release
# tarball (repacked without upstream's own debian/ as 0.5.6+ds) and the four asset zips upstream's CMake would
# fetch at install time (openrct2/upstream.mk), and passes the paths; the zips go in as component tarballs (one
# zip each), debian/rules unpacks them into data/ so the build is offline. Builds openrct2 (the game, software
# renderer), openrct2-data and openrct2-music (both arch all, built in the same chroot run). The RCT2 game data
# itself is the licensed rct2-data package (tools/rct2-data.sh), which the game finds in /usr/share/games/rct2.
TYPE=upstream
SOURCE=openrct2
UPVER=0.5.6+ds
DEBREV=1
ORIG=$ORCT2_ORIG
COMPONENTS="objects:$ORCT2_OBJECTS titleseq:$ORCT2_TITLESEQ opensfx:$ORCT2_OPENSFX openmusic:$ORCT2_OPENMUSIC"
BUILD=native
