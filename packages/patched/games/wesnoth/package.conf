# Debian source package this directory patches (tools/deb-fetch.sh, deb-prepare.sh, deb-build.sh).
# Wesnoth 1.18 for ppc64: Debian has no ppc64 build (its link failed on Boost.Context's fcontext
# symbols, Debian #1146645); it builds against our boost-context (LOCAL_DEPS). The packaging patch
# builds only the two architecture-dependent packages (wesnoth-1.18, wesnoth-1.18-server) and
# points their data dependencies at Debian's arch-all packages of the same version.
TYPE=debsrc
SOURCE=wesnoth-1.18
VERSION=1:1.18.8-1
DSC_SHA256=681aef50284b95177fd57e20b4a2489a01d62ab31af29bb0fe3db0dbcada763c
BUILD=native
LOCAL_DEPS="boost-context"
NATIVE_PROFILES=pkg.wesnoth.archonly
CHECK=1
