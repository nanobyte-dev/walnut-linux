# Debian source package this directory patches (tools/deb-fetch.sh, deb-prepare.sh, deb-build.sh).
# libpng1.6 decodes the PNGs of SuperTuxKart (Irrlicht), Sauerbraten (SDL2_image) and most other games.
# Ours: built for the Cell PPE, and the row unfilters (Sub, Up, Avg, Paeth) without the load-hit-stores
# of the stock C and in AltiVec for 3- and 4-byte pixels (docs/PROFILING.md "Load-time decoders and
# linking"). Debian's PowerPC VSX option stays off. CHECK=1: libpng's own tests (make check).
TYPE=debsrc
SOURCE=libpng1.6
VERSION=1.6.59-1
BUILD=native
CHECK=1
DSC_SHA256=695ab8dc9c70b335ea3fb3c8d7e7f18b05d6a9d73090a05b97785e03198eb201
