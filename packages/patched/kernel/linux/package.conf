# Debian source package (tools/deb-fetch.sh, deb-prepare.sh); the kernel is cross-built for ppc64
# here and linux-kbuild natively in the ppc64 chroot (tools/deb-build.sh, BUILD=cross-linux)
TYPE=debsrc
SOURCE=linux
VERSION=6.12.115-2
DSC_SHA256=0baf11fbc9cd651c2238c1b394142a9d58006bba604e5840f38086331286ee5c
# 6.12.115-2 is in the security archive only so far (snapshot of 2026-11-02, trixie-security; the main
# archive's newest is 6.12.113-1): tools/deb-fetch.sh points its deb-src line there
SOURCE_SECURITY_SNAPSHOT=20261102T161514Z
BUILD=cross-linux
# Our flavours: release (Debian flavour ps3: release <Debian upstream version>+ps3.<N>, meta linux-image-ps3) and
# debug (Debian flavour ps3-debug: release <upstream version>+ps3.<N>-debug<stamp>, meta
# linux-image-ps3-debug); packaging/: debian/config/ppc64/defines.toml. Each one's full .config is
# made by tools/linux-config.sh at source-package time: DEFCONFIG plus the config/ fragments of
# FRAGMENTS_<flavour>, merged in order; flavours/<flavour>.args are its boot arguments.
FLAVOURS="release debug"
DEBIAN_FLAVOUR_release=ps3
DEBIAN_FLAVOUR_debug=ps3-debug
DEFCONFIG=ps3_defconfig
FRAGMENTS_release="ps3.config ps3-release.config"
FRAGMENTS_debug="ps3.config ps3-debug.config"
# Round 3 Q17: tools/linux-config.sh fails when a fragment option didn't stick, and when one of these
# lists is not met, whatever the fragments say (tools/linux-config-check.sh; test: tests/config-check.sh).
# REQUIRE_SET: "CONFIG_X=y" (or "=y|m") lines the finished .config must have: the hardening options
# kept from ps3_defconfig and Debian's tree. REQUIRE_UNSET: options that must be off or absent: the
# drivers that write flash, storage regions or the hypervisor's repository (docs/OTHEROS-PATCHES.md),
# the isolated-SPU filesystems. Per flavour: the research drivers (K4) are in the debug kernel only.
REQUIRE_SET="CONFIG_STRICT_DEVMEM=y CONFIG_STACKPROTECTOR_STRONG=y CONFIG_RANDOMIZE_KSTACK_OFFSET=y CONFIG_LIST_HARDENED=y CONFIG_SECCOMP=y CONFIG_FB_PS3=y CONFIG_PS3_VRAM=m CONFIG_PS3_SYS_MANAGER_HWMON=y"
REQUIRE_UNSET="CONFIG_PS3_FLASH CONFIG_PS3_FLASH_NG CONFIG_PS3_NOR_FLASH CONFIG_PS3_STRGMNGR CONFIG_PS3_ENCDEC CONFIG_SPUISO_FS CONFIG_SPULDR_FS CONFIG_PS3_REPOSITORY_WRITE CONFIG_UFS_FS_WRITE CONFIG_PS3_DISP_MANAGER"
REQUIRE_SET_release=""
REQUIRE_UNSET_release="CONFIG_PS3_LV1CALL CONFIG_PS3_PHYSMEM"
REQUIRE_SET_debug="CONFIG_PS3_LV1CALL=m CONFIG_PS3_PHYSMEM=m CONFIG_STRICT_KERNEL_RWX=y"
REQUIRE_UNSET_debug=""
# Build profiles (tools/deb-build.sh): the cross build makes the images, headers and metas; the
# native one (ppc64 chroot) only linux-kbuild
CROSS_PROFILES=cross,nopython,nodoc,pkg.linux.nosource,pkg.linux.notools,pkg.linux.nokerneldbg
NATIVE_PROFILES=pkg.linux.nokernel,pkg.linux.mintools,nopython,nodoc,pkg.linux.nosource
