# Debian source package this directory patches (tools/deb-fetch.sh, deb-prepare.sh, deb-build.sh).
# game-data-packager is in contrib (the data it packages isn't free), which debian-ports doesn't
# carry: deb-fetch.sh adds contrib's deb-src lines for the fetch. Its build dependencies are in main.
# Format 3.0 (native): deb-prepare.sh's quilt push leaves the tree patched, and the source package
# made from it is that tree (debian/patches/ps3/ ships alongside as the record).
# NATIVE_PROFILES: only game-data-packager and game-data-packager-runtime are built (packaging 0001);
# the quake/quake2/quake3 wrapper and server packages stay Debian's.
TYPE=debsrc
SOURCE=game-data-packager
VERSION=89
COMPONENT=contrib
DSC_SHA256=864657a620ba537dafe29458eb83533b2a26f12464e12b9322ef670b1838b594
BUILD=native
NATIVE_PROFILES=pkg.game-data-packager.nowrappers
