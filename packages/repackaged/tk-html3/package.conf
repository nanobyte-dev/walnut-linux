# Upstream source (Debian has none since its tk-html3 went): Tkhtml 3.0, TkinterWeb's fork of Dan
# Kennedy's HTML/CSS widget for Tcl/Tk 8 (github.com/Andereoo/TkinterWeb-Tkhtml, branch 3.0, the
# commit packages/repackaged/tk-html3/upstream.mk pins; the Makefile downloads it and passes the
# path as TKHTML_ORIG). The Tcl package Tkhtml 3.0 in /usr/lib/tcltk/<triplet>/tkhtml3.0, loaded
# by python3-tkinterweb (packages/repackaged/tkinterweb) in place of the binaries upstream bundles
# for x86 and arm only. Built natively (the ppc64 chroot); the version is upstream's 3.0 plus the
# commit's date and hash.
TYPE=upstream
SOURCE=tk-html3
UPVER=3.0+git20260919.d6a6df3
DEBREV=1
ORIG=$TKHTML_ORIG
COMPONENTS=
BUILD=native
CHECK=1
