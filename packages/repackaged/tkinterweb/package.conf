# Upstream source (Debian has none): TkinterWeb, the Python interface to the Tkhtml widget (the pinned
# PyPI sdist, packages/repackaged/tkinterweb/upstream.mk; the Makefile downloads it and passes the path
# as TKW_ORIG). Package python3-tkinterweb (Architecture: all). Upstream's companion
# tkinterweb-tkhtml, which bundles Tkhtml binaries for x86 and arm only, is replaced by
# debian/tkinterweb_tkhtml/: the same loader, pointed at the system's Tkhtml (tk-html3,
# packages/repackaged/tk-html3). Built in the chroot for dh-python (pybuild, byte code at install).
TYPE=upstream
SOURCE=tkinterweb
UPVER=4.25.5
DEBREV=1
ORIG=$TKW_ORIG
COMPONENTS=
BUILD=native
CHECK=1
