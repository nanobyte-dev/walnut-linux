# Native package: this directory is the source (tools/deb-prepare.sh, deb-build.sh)
TYPE=native
SOURCE=walnut-games
BUILD=indep
# the games catalog (make gamedb-catalog, tools/gamedb/pack-catalog.py): catalog.json, thumbnails and
# screenshots, unpacked to /usr/share/walnut-games/ by debian/rules; the data manifest (make gdp-manifest,
# committed), /usr/share/walnut-games/data-manifest.json: walnut-games-helper import-data checks against it
# the site's pages for the Details view (make gamedb-app-pages, tools/gamedb/pack-app-pages.py: build.sh --app,
# the catalog's pictures as links to them), unpacked to /usr/share/walnut-games/pages/
COPY_IN="build/gamedb/catalog.tar:catalog/catalog.tar tools/gamedb/gdp-manifest.json:catalog/data-manifest.json build/gamedb/app-pages.tar:catalog/app-pages.tar"
# everything the packed catalog is made from: the gamedb files the app shows (gamedb/README.md
# "Versions": a game's index.md, thumb.png, build.toml, its rated test and sessions (the records and
# their shots/; shots/pc/ is not read), the patches its patched_by packages carry; never technical.md,
# investigations, todo.toml, benchmark/ or a session's raw/), and the tools that check, rate and pack them (with the package lookup and the licensed names
# check.py and catalog.py ask); and what the Details pages are made from: the site (website/gamedb), a game's
# technical.md, guides, investigations and benchmark folder, the engines, the research pages, build.sh and
# its pinned Hugo. Patterns as GitHub reads them: * within one path component, ** across.
VERSION_PATHS="gamedb/games/*/index.md gamedb/games/*/thumb.png gamedb/games/*/build.toml gamedb/games/*/rating/test.toml gamedb/games/*/rating/sessions/*/* gamedb/games/*/rating/sessions/*/shots/* gamedb/games/*/packages/*/patches/** gamedb/engines/*/packages/*/patches/** tools/gamedb/catalog.py tools/gamedb/pack-catalog.py tools/gamedb/score.py tools/gamedb/check.py tools/gamedb/evidence.py tools/pkg-dir.sh tools/licensed.py gamedb/engines/*/build.toml tools/gamedb/gdp-manifest.json website/gamedb/** gamedb/games/*/technical.md gamedb/games/*/guides/** gamedb/games/*/investigations/** gamedb/games/*/benchmark/** gamedb/engines/** gamedb/research/** tools/gamedb/technical.py tools/gamedb/build.sh tools/gamedb/hugo.version tools/gamedb/pack-app-pages.py"
