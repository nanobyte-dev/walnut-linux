# Native package: this directory is the source (tools/deb-prepare.sh, deb-build.sh)
TYPE=native
SOURCE=walnut-games
BUILD=indep
# the games catalog (make gamedb-catalog, tools/gamedb/pack-catalog.py): catalog.json, thumbnails and
# screenshots, unpacked to /usr/share/walnut-games/ by debian/rules
COPY_IN="build/gamedb/catalog.tar:catalog/catalog.tar"
# everything the packed catalog is made from: the gamedb files the app shows (gamedb/README.md
# "Versions": a game's index.md, thumb.png, build.toml, its rated test and sessions, the patches its
# patched_by packages carry; never technical.md, investigations, todo.toml, benchmark/ or a session's
# raw/), and the tools that check, rate and pack them (with the package lookup and the licensed names
# check.py and catalog.py ask). Patterns as GitHub reads them: * within one path component, ** across.
VERSION_PATHS="gamedb/games/*/index.md gamedb/games/*/thumb.png gamedb/games/*/build.toml gamedb/games/*/rating/test.toml gamedb/games/*/rating/sessions/*/* gamedb/games/*/packages/*/patches/** gamedb/engines/*/packages/*/patches/** tools/gamedb/catalog.py tools/gamedb/pack-catalog.py tools/gamedb/score.py tools/gamedb/check.py tools/pkg-dir.sh tools/licensed.py tools/licensed-packages.txt"
