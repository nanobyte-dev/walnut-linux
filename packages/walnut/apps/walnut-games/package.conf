# Native package: this directory is the source (tools/deb-prepare.sh, deb-build.sh)
TYPE=native
SOURCE=walnut-games
BUILD=indep
# the games catalog (make gamedb-catalog, tools/gamedb/pack-catalog.py): catalog.json, thumbnails and
# screenshots, unpacked to /usr/share/walnut-games/ by debian/rules
COPY_IN="build/gamedb/catalog.tar:catalog/catalog.tar"
# everything the packed catalog is made from: the entries, and the tools that check, rate and pack them
# (with the package lookup and the licensed names check.py and catalog.py ask)
VERSION_PATHS="website/gamedb/content tools/gamedb/catalog.py tools/gamedb/pack-catalog.py tools/gamedb/score.py tools/gamedb/check.py tools/pkg-dir.sh tools/licensed.py tools/licensed-packages.txt"
