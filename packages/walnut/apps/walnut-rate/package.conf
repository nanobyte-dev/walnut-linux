# Native package: this directory is the source (tools/deb-prepare.sh, deb-build.sh)
TYPE=native
SOURCE=walnut-rate
BUILD=indep
# the session harness as our own runs use it (make walnut-rate-bench: the Makefile's BENCH_TAR without bench/analysis
# and bench/tests, into build/walnut-rate/bench.tar: harness/, lib/, games/<id>/ with each game's benchmark recipe,
# its played test and its data.txt), unpacked to /usr/lib/walnut-rate/bench/ by debian/rules; and the scrub's
# code, tools/gamedb/evidence.py, as /usr/lib/walnut-rate/evidence.py. No second copy of either in the repository.
COPY_IN="build/walnut-rate/bench.tar:built/bench.tar tools/gamedb/evidence.py:built/evidence.py"
# everything bench.tar is made from (the harness, the recipes and their files, the played tests, the build.toml
# files data.txt comes from and the tool that reads them) and the scrub. Patterns as GitHub reads them.
VERSION_PATHS="bench/harness/** bench/lib/** gamedb/games/*/benchmark/recipe.sh gamedb/games/*/benchmark/analysis.toml gamedb/games/*/benchmark/lib/** gamedb/games/*/benchmark/assets/** gamedb/games/*/rating/test.toml gamedb/games/*/build.toml gamedb/engines/*/build.toml tools/gamedb/build-info.py tools/gamedb/evidence.py"
