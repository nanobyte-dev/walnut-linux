# Native package, built per kernel flavour in the ppc64 chroot against that kernel's headers
# package (linux-headers-<release>, from our own linux build: LOCAL_DEPS). debian/*.in get
# @KERNEL_RELEASE@ and @KERNEL_FLAVOUR@ (tools/deb-prepare.sh); make ps3rsx-modules builds them all.
TYPE=native
SOURCE=ps3rsx
BUILD=native
KERNEL_PACKAGE=1
LOCAL_DEPS=linux
