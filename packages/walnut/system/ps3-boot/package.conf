# Native package: this directory is the source (tools/deb-prepare.sh, deb-build.sh)
TYPE=native
SOURCE=ps3-boot
BUILD=indep
# the internal install's generic initramfs (tools/ssdimg, make initrd-walnut), shipped as
# /usr/lib/ps3/boot/initrd-walnut.img: ps3-hdd1-boot puts it on dev_hdd1
COPY_IN="build/initrd/initrd-walnut.img:initramfs/initrd-walnut.img"
VERSION_PATHS="tools/ssdimg"
