# ps3-desktop: real-time audio for games (docs/SPU-AUDIO.md "Real-time mixer"). The audio group
# (the desktop user is in it) may run threads at SCHED_RR/SCHED_FIFO up to priority 10: OpenAL
# Soft's mixer asks for 1 itself, and game mode (ps3-rt-audio) sets 1 on SDL's and the other
# libraries' audio threads. Read by pam_limits at the next login (the tty1 desktop, SSH).
# Nothing that asks for more (FluidSynth's own driver: 60, JACK) gets it. The kernel's RT
# throttling stays at its default (95% of each hardware thread); RLIMIT_RTTIME is not set.
@audio	soft	rtprio	10
@audio	hard	rtprio	10
