# Native package: this directory is the source (tools/deb-prepare.sh, deb-build.sh). The game-specific part
# comes from gamedb (make gamedb-integration, tools/gamedb/pack-integration.py): the launchers, installed
# config files, divert and migrate-home lists, unpacked by debian/rules. It builds one binary,
# ps3-games-integration (the metapackages ps3-games and ps3-games-free went on 2026-10-28)
TYPE=native
SOURCE=ps3-games
BUILD=indep
COPY_IN="build/gamedb/integration.tar:integration/integration.tar"
# what integration.tar is made from (gamedb/README.md "Versions"): every game's build.toml and desktop/,
# and the tool that packs them. Patterns as GitHub reads them: * within one path component, ** across
VERSION_PATHS="gamedb/games/*/build.toml gamedb/games/*/desktop/** tools/gamedb/pack-integration.py"
