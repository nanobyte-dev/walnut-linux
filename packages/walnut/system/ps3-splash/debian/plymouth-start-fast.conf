# ps3-splash: no XKB keymap for Plymouth. It compiles one from /usr/share/X11/xkb at start, for
# typed input (passwords), which this system never asks for at boot; from the busy USB disk the
# compile took 3 s before the splash could show. Without the data it skips the keymap at once.
[Service]
Environment=XKB_CONFIG_ROOT=/nonexistent
