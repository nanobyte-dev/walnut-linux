# The research modules of the 6.12.111 kernels (ps3lv1call: any hypervisor call from userspace, flash writes
# included; ps3physmem: real memory from physical 0) are built into the release flavour there. Nothing loads
# them; this makes `modprobe` refuse too. Kernels from 6.12.115 on carry them in the debug flavour only.
# To use them on purpose (the debug-flavour workflow, tools/lv1net.py): mask this file with an empty one of
# the same name, `sudo touch /etc/modprobe.d/walnut-research.conf`, or load by path with `insmod`;
# delete the empty file afterwards.
install ps3lv1call /bin/false
install ps3physmem /bin/false
