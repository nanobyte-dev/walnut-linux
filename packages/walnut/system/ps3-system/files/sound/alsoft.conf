# OpenAL Soft's defaults on the PS3 (ps3-system; docs/SPU-AUDIO.md "OpenAL Soft's output format").
# OpenAL reads this after /etc/openal/alsoft.conf and before ~/.alsoftrc, ~/.config/alsoft.conf and
# $ALSOFT_CONF, so any of those overrides it: `sample-type = float32` there is OpenAL's own default.
[general]
# 16-bit output. The PS3's ALSA device is S16 (default: plug, softvol, dmix:CARD=PS3,FORMAT=S16), so
# with OpenAL's float output ALSA's plug converted every sample on the mixer thread
# (snd_pcm_lfloat_convert_float_integer, 0.7-1.9% of a game's CPU); now OpenAL writes S16 itself.
sample-type = int16
# OpenAL switches both on for integer output; its float output had neither (plug clamps the same
# way), so the sound is what it was to within the last bit.
output-limiter = false
dither = false
