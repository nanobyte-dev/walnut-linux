# Display-only mode (ps3rsx's recovery failed, or the escape hatch): the same RSX device without glamor; the CPU
# draws into a shadow framebuffer that modesetting copies to the dumb scanout buffer in VRAM.
# Used by the session start when /sys/devices/platform/ps3rsx/display_only reads 1
# (Xorg -configdir ps3-display-only.d). Xorg still reads /usr/share/X11/xorg.conf.d after this
# directory, whose 20-ps3rsx.conf has its own Device "RSX" with glamor: the layout below names
# this directory's device, so that one is never used (2026-11-01: with two "RSX" devices the
# glamor one won).
Section "ServerFlags"
	Option "AutoAddGPU" "false"
EndSection

Section "ServerLayout"
	Identifier "ps3-display-only"
	Screen "RSX-display-only"
	# 20-ps3rsx.conf's device would otherwise come in as a second, glamor GPU device
	Inactive "RSX"
EndSection

Section "Screen"
	Identifier "RSX-display-only"
	Device "RSX-display-only"
EndSection

Section "Device"
	Identifier "RSX-display-only"
	Driver "modesetting"
	Option "kmsdev" "/dev/dri/card0"
	Option "AccelMethod" "none"
	Option "ShadowFB" "true"
EndSection
