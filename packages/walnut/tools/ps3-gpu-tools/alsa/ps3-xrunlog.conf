# ps3-xrunlog (ps3-xrunlog.so, docs/games/SUITE.md "Sound dropouts"): the game's sound dropouts logged,
# for one program only, without touching any configuration file:
#   ALSA_CONFIG_PATH=/usr/share/alsa/alsa.conf:/usr/lib/ps3/lib/ps3-xrunlog.conf PS3_XRUNLOG=<log> <program>
# alsa.conf's hook 0 loads /etc/alsa/conf.d, /etc/asound.conf and ~/.asoundrc; this hook runs after it
# and puts the plugin in front of whatever pcm.default they made (renamed pcm.ps3xrun_orig).
hook_func.ps3xrun {
	lib "/usr/lib/ps3/lib/ps3-xrunlog.so"
	func "ps3_xrunlog_hook"
}
@hooks.1 {
	func ps3xrun
}
pcm_type.ps3xrun {
	lib "/usr/lib/ps3/lib/ps3-xrunlog.so"
}
