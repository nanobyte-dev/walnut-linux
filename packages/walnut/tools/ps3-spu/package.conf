# Native package: this directory is the source (tools/deb-prepare.sh, deb-build.sh)
# split: ps3-spu (ppc64) in the chroot, ps3-spu-programs (all) with our host spu-elf toolchain
TYPE=native
SOURCE=ps3-spu
BUILD=split
INDEP_PATH=/work/build/spu/install/opt/spu/bin
# CI builds these make targets first (github-ci/build-package.sh): the spu-elf toolchain INDEP_PATH names
CI_FIRST="spu-toolchain"
