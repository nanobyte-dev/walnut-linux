seta cl_renderer "opengl1"
seta r_mode "-2"
seta r_fullscreen "1"
seta r_swapInterval "1"
seta com_maxfps "60"
// DXT1 for opaque textures: 11-14 MB less VRAM (room for the VRAM swap), compressed by libspeq at
// load (+0.5 s; docs/SPU-OFFLOAD-SURVEY.md "Measured: step 0")
seta r_ext_compressed_textures "1"
seta in_joystick "1"
seta in_joystickUseAnalog "1"
bind PAD0_RIGHTTRIGGER "+attack"
bind PAD0_LEFTTRIGGER "+zoom"
bind PAD0_A "+moveup"
bind PAD0_B "+movedown"
bind PAD0_RIGHTSHOULDER "weapnext"
bind PAD0_LEFTSHOULDER "weapprev"
bind PAD0_X "+button2"
bind PAD0_START "togglemenu"
bind PAD0_BACK "+scores"
