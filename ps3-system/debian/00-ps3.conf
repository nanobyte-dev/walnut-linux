# NetworkManager runs the network, the wired port included, and DNS: the desktop's applet shows the
# wired connection. The exception is an NFS root over the wired port: ps3-nfsroot-network.service makes
# eth0 unmanaged for that boot (/run/NetworkManager/conf.d) and systemd-networkd keeps it
# (20-ps3-wired.network matches root=/dev/nfs only).
[main]
dns=default
rc-manager=symlink

[connection]
# the client ID Petitboot's udhcpc sends (01:<MAC>): the router's DHCP server (Kea) then gives the
# console the same lease in Petitboot and in Linux (see 20-ps3-wired.network)
ipv4.dhcp-client-id=mac
