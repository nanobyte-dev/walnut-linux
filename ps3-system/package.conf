# Native package: this directory is the source (tools/deb-prepare.sh, deb-build.sh)
TYPE=native
SOURCE=ps3-system
BUILD=indep
# the release version (the top-level VERSION file, the only place it is written): os-release's
# VERSION_ID and the console's login banner; a new VERSION is a new ps3-system
COPY_IN="VERSION:walnut-version"
VERSION_PATHS="VERSION"
