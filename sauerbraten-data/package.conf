# Upstream source (not in Debian): a tarball of the game data of the Sauerbraten 2020_12_29 release
# (data/, packages/, docs/ and README.html; tools/sauerbraten-full-data.sh). Mixed licences, much of it
# CC BY-NC or all rights reserved, so Section local/games and tools/licensed-packages.txt:
# tools/repo-publish.sh puts the package in ps3-licensed, never in ps3 or ps3-dev, and CI never builds
# it. The Makefile passes the tarball's path (SBD_ORIG). Not in git: made from the release at build time.
TYPE=upstream
SOURCE=sauerbraten-data
UPVER=0.0.20201229
DEBREV=1
ORIG=$SBD_ORIG
COMPONENTS=""
BUILD=indep
