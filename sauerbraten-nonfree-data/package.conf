# Upstream source (not in Debian): a tarball of the files from the Sauerbraten 2020_12_29 release
# that Debian's cube2-data lacks (sauerbraten-nonfree-data/files.txt, tools/sauerbraten-data.sh).
# CC BY-NC / all-rights-reserved content, so Section local/games and tools/licensed-packages.txt:
# tools/repo-publish.sh puts the package in ps3-licensed, never in ps3 or ps3-dev. The Makefile
# passes the tarball's path (SB_ORIG).
TYPE=upstream
SOURCE=sauerbraten-nonfree-data
UPVER=0.0.20201229
DEBREV=1
ORIG=$SB_ORIG
COMPONENTS=""
BUILD=indep
