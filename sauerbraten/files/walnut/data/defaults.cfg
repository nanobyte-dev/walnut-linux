// Walnut's defaults for Sauerbraten on the PS3. The engine runs data/defaults.cfg only when
// ~/.sauerbraten/config.cfg does not exist yet (the first start), and the launcher puts this
// directory ahead of the game data, so this file is found first. It runs the game's own defaults,
// then changes what the PS3 needs; the game writes the result to config.cfg on quit, and from
// then on the player's settings are the player's.

exec "/usr/share/games/sauerbraten/data/defaults.cfg"

// Textures from 512 pixels up are compressed at upload (DXT1, DXT5 with alpha) instead of from
// 1024 (the engine's default; our cube2 0001 makes it apply on Mesa). Most of the release's
// world textures are 512 pixels: uncompressed they filled the RSX's 256 MB (180 MB of VRAM on
// eternal_valley, 210 MB after the next map), the VRAM swap had to give all of its VRAM back
// and the game's frame-sized buffers no longer fit. In the console, /texcompress 1024 undoes it.
texcompress 512
