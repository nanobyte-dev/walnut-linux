# walnut-ccache: ccache's remote storage for builds (CI and the dev PC), GET/PUT/HEAD/DELETE on
# files under /srv/ccache (WebDAV PUT). Every request needs the login (deploy.sh writes it from
# WALNUT_CCACHE_USER/PASS); clients reach it through tools/ccache-relay.py over HTTPS, never in the
# clear. Runs as an ordinary user (uid 1000, the directory's owner).
worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    access_log off;
    # uploads land on the store's own disk, so a finished PUT is renamed into place (atomic; a reader
    # sees the old file or the whole new one) instead of copied across filesystems
    client_body_temp_path /srv/ccache/.incoming;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    sendfile on;
    server {
        listen 8080 default_server;
        root /srv/ccache;
        client_max_body_size 256m;
        auth_basic "walnut ccache";
        auth_basic_user_file /etc/nginx/ccache.htpasswd;
        location = /health { auth_basic off; return 200 "ok\n"; }
        location /ccache/ {
            alias /srv/ccache/;
            dav_methods PUT DELETE;
            create_full_put_path on;
            dav_access user:rw group:r all:r;
        }
    }
}
