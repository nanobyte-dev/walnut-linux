# walnut-rate's receiver behind the main proxy: these two locations go into walnut.nanobyte.dev.conf's 443 server
# block, above `location /`, with @WALNUT_RATE_LISTEN@ replaced by state/walnut-rate-receiver.env's address (mainproxy_net's
# gateway and the port, e.g. 172.18.0.1:8096). Not in walnut.nanobyte.dev.conf yet: servers/README.md
# "walnut-rate's receiver" has the steps. nginx takes the whole body first (proxy_request_buffering), so a slow
# client holds nginx, never the receiver, and refuses anything over the receiver's MAX_BUNDLE (32 MiB) itself.
location = /rate/submit {
    limit_except POST { deny all; }
    client_max_body_size 32m;
    client_body_buffer_size 1m;
    client_body_timeout 60s;
    proxy_request_buffering on;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_pass http://@WALNUT_RATE_LISTEN@;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
}
location = /rate/health {
    proxy_pass http://@WALNUT_RATE_LISTEN@;
    proxy_connect_timeout 5s;
}
