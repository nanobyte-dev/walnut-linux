# walnut-repo's nginx: the files behind walnut.nanobyte.dev, from /data/nanobyte/Walnut/www (read-only):
#   apt/      the signed suites (stable, testing and their -debug)
#   licensed/ the licensed suite: game data we may not redistribute, for the project owner only
#   download/ release images, kernels, the installer, SHA256SUMS
#   status/   each upload's outcome (walnut-watch), read by the publishers
# and the Debian snapshot cache for builds. A plain nginx that site updates never restart (the site is
# walnut-site); walnut-watch publishes into www/, its work in progress under hidden names.
# LOG-ONLY allowlist for the snapshot cache: the archives, suites and architectures our builds use, each
# suite only in its own archive: debian-ports unstable/sid (config.mk DEBIAN_SUITE, ppc64 for the PS3),
# debian unstable/sid (the builder image, amd64) and trixie, debian-security trixie-security (the builder
# image's deb-src lines for the 6.12 kernel, build-containers/Dockerfile.deb: source indices only);
# architectures ppc64, amd64, all and source. test_snapshot_allowlist.py checks the map.
# A request for another suite or architecture is still served; it is logged with "outside the allowlist"
# so the log shows what to expect before a refusal is switched on (replace the log line with `return 403`).
log_format snapshot_outside '$remote_addr [$time_local] "$request" outside the snapshot allowlist';
map $uri $snapshot_outside {
    default 0;
    ~^/debian-snapshot/archive/(?!(debian|debian-ports|debian-security)/)[^/]+/[^/]+/dists/ 1;
    ~^/debian-snapshot/archive/debian/[^/]+/dists/(?!(unstable|sid|trixie)/) 1;
    ~^/debian-snapshot/archive/debian-ports/[^/]+/dists/(?!(unstable|sid)/) 1;
    ~^/debian-snapshot/archive/debian-security/[^/]+/dists/(?!trixie-security/) 1;
    ~^/debian-snapshot/archive/[^/]+/[^/]+/dists/trixie(-security)?/[^/]+/(?!source/) 1;
    ~^/debian-snapshot/archive/[^/]+/[^/]+/dists/[^/]+/.*(binary|Contents)-(?!(ppc64|amd64|all)(/|\.|$)) 1;
}

server {
    listen 80 default_server;
    root /srv/walnut;
    sendfile on;
    access_log /dev/stdout;

    include /etc/nginx/conf.d/repo-headers.inc;
    location ~ /\. { return 404; }

    location /apt/ {
        include /etc/nginx/conf.d/repo-headers.inc;
        autoindex on;
        location ~ /dists/ { include /etc/nginx/conf.d/repo-headers.inc; add_header Cache-Control no-cache; }
    }
    location /download/ {
        include /etc/nginx/conf.d/repo-headers.inc;
        autoindex on;
    }
    location /licensed/ {
        include /etc/nginx/conf.d/repo-headers.inc;
        autoindex on;
        auth_basic "Walnut licensed";
        auth_basic_user_file /etc/nginx/walnut.htpasswd;
        location ~ /dists/ { include /etc/nginx/conf.d/repo-headers.inc; add_header Cache-Control no-cache; }
    }
    location /status/ {
        include /etc/nginx/conf.d/repo-headers.inc;
        add_header Cache-Control no-cache;
    }

    # Debian's snapshot for builds (CI and the dev PC), through walnut-aptcache: the pinned snapshot
    # dates only, which deploy.sh fills in from config.mk, the upstream.mk and package.conf files
    location ~ ^/debian-snapshot/archive/(debian|debian-ports|debian-security)/(@SNAPSHOT_DATES@)/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $up_cache walnut-aptcache;
        proxy_pass http://$up_cache:3142;
        proxy_buffering off;
        proxy_read_timeout 600s;
        access_log /dev/stdout snapshot_outside if=$snapshot_outside;
    }
    location /debian-snapshot/ { return 404; }

    location = /health { access_log off; return 200 "ok\n"; }
    location / { return 404; }
}
