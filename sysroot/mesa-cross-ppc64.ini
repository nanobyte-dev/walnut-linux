# Meson cross file: Debian ppc64 (big-endian, ELFv1) with the sysroot from `make mesa-sysroot`.
# Paths are the ones inside the build container (the repository is mounted at /work).
[constants]
sysroot = '/work/build/mesa/sysroot'
common  = ['--sysroot=' + sysroot, '-mcpu=cell', '-ffile-prefix-map=/work/=']

[binaries]
c          = 'powerpc64-linux-gnu-gcc'
cpp        = 'powerpc64-linux-gnu-g++'
ar         = 'powerpc64-linux-gnu-ar'
strip      = 'powerpc64-linux-gnu-strip'
pkg-config = 'pkg-config'

[built-in options]
c_args          = common
cpp_args        = common
c_link_args     = ['--sysroot=' + sysroot]
cpp_link_args   = ['--sysroot=' + sysroot]

[properties]
needs_exe_wrapper = true
sys_root          = sysroot
pkg_config_libdir = [sysroot + '/usr/lib/powerpc64-linux-gnu/pkgconfig', sysroot + '/usr/share/pkgconfig']

[host_machine]
system     = 'linux'
cpu_family = 'ppc64'
cpu        = 'cell'
endian     = 'big'
