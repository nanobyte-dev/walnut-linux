# Debian source package this directory patches (tools/deb-fetch.sh, deb-prepare.sh, deb-build.sh).
# Teeworlds 0.7.5 on big-endian 64-bit: 0001 makes the UDP sockets non-blocking for real (FIONBIO
# was given a pointer to an unsigned long, the kernel reads an int: on ppc64 that int is the long's
# zero high half, so the sockets stayed blocking and the client hung in recvfrom() right after the
# server accepted it, at the loading screen). Builds teeworlds, teeworlds-server, teeworlds-data.
TYPE=debsrc
SOURCE=teeworlds
VERSION=0.7.5-3
DSC_SHA256=928aaf368b0ae8f4ba7cf7253709f48e75dab963e7323b6ebe2887e31f1a3f67
BUILD=native
