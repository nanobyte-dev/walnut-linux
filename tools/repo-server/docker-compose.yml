# The LAN apt repository: static files that aptly publishes on the dev PC (tools/repo-publish.sh
# rsyncs them to REPO_HOST:REPO_DIR, config.local.mk). Deployed to REPO_DIR on the server; the
# address to listen on comes from a .env file next to this one (not tracked): REPO_BIND_IP=<LAN IP>.
services:
  nginx:
    image: nginx:stable-alpine
    ports: ["${REPO_BIND_IP:?set REPO_BIND_IP in .env}:8070:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/usr/share/nginx/repo:ro
    restart: unless-stopped
