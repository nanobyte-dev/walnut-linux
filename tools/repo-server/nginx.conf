# Serves public/: ps3/ and ps3-licensed/ (official, add-only), ps3-dev/ and ps3-dbgsym/ (throwaway).
# ps3-licensed/ holds content we may not redistribute; LAN-only like the rest (the port is bound to
# the server's LAN address, REPO_BIND_IP). Restricting it later is one block here, e.g.
#   location /ps3-licensed/ { allow <the PS3's address>; deny all; }
server {
    listen 80 default_server;
    root /usr/share/nginx/repo;
    autoindex on;
    sendfile on;
    access_log /dev/stdout;
    # indices change on every publish; pool files never do
    location ~ /dists/ { add_header Cache-Control no-cache; }
}
