# Serves public/: ps3/ (official, add-only), ps3-dev/ and ps3-dbgsym/ (throwaway)
server {
    listen 80 default_server;
    root /usr/share/nginx/repo;
    autoindex on;
    sendfile on;
    access_log /dev/stdout;
    # indices change on every publish; pool files never do
    location ~ /dists/ { add_header Cache-Control no-cache; }
}
