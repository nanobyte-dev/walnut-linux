run = ["packages/patched/kernel/linux/tests/ps3disk-guard.sh"]

[[suite]]
name = "kernel-config-check"
what = "tools/linux-config-check.sh: a dropped or changed config option, the hardening and must-stay-off lists of the kernel's package.conf, the research drivers per flavour"
run = ["packages/patched/kernel/linux/tests/config-check.sh"]

[[suite]]
name = "kernel-gart-parse"
what = "local/0007's size parser against the memparse wraps, no panic on an oversized reservation, local/0049's re-probe cancel in remove"
run = ["packages/patched/kernel/linux/tests/ps3rsx-gart-parse.sh"]

[[suite]]
name = "kernel-lockdep-variant"
what = "LINUX_VARIANT=lockdep: a test-build version of its own, the release flavour unaffected, PROVE_LOCKING in the debug config; the config half needs a patched tree in build/tmp/lane-km/t115 or LINUX_TREE"
run = ["packages/patched/kernel/linux/tests/lockdep-variant.sh"]

[[suite]]
name = "game-data-packager"
what = "our patches' --progress-fd and --no-launchers on the built deb, in the deb builder image: packages/patched/tools/ game-data-packager/tests; skipped without build/debs/game-data-packager"
run = ["packages/patched/tools/game-data-packager/tests/run-in-builder.sh"]
ci_skip = { "game-data-packager" = "needs build/debs/game-data-packager (a ppc64 build in the deb builder image)" }

[[suite]]
name = "autogm"
what = "packages/walnut/system/ps3-desktop/tests/autogm-check.sh: needs Xvfb+openbox or docker/podman"
run = ["bash", "tools/suites/autogm.sh"]
slow = true

[[suite]]
name = "ssdimg-vm"
what = "tools/ssdimg/vm-e2e.sh: ps3-imgmap on a real big-endian UFS2 image in a KVM guest of the host's kernel, then Phase B: ps3-imgmap-boot's devices, the initramfs booting root from the image, refused boots; the second Phase B geometry behind the kernel guard, simulated by a module built from local/0045 for the host kernel (needs its headers, else that part is skipped); needs docker, qemu-system-x86_64, /dev/kvm"
run = ["tools/ssdimg/vm-e2e.sh"]
slow = true
