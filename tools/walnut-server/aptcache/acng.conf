# walnut-aptcache: http://walnut-aptcache:3142/debian-snapshot/<path> is snapshot.debian.org/<path>
CacheDir: /var/cache/apt-cacher-ng
LogDir: /var/log/apt-cacher-ng
Port: 3142
BindAddress: 0.0.0.0
SocketPath: /run/apt-cacher-ng/socket
Remap-snapshot: /debian-snapshot ; http://snapshot.debian.org
# snapshot answers with redirects to /file/<hash>; throttled requests are retried
RedirMax: 8
DlMaxRetries: 8
NetworkTimeout: 120
# one snapshot never changes: nothing in the cache expires
ExThreshold: 0
# no report or admin page
ReportPage:
VerboseLog: 1
# a pinned snapshot's indices never change either: cache them like packages, never ask upstream again
# (otherwise each request re-checks InRelease upstream, and snapshot's throttling shows through)
VfilePattern: ^/walnut-never-volatile$
PfilePatternEx: (/InRelease|/Release|/Release\.gpg|/Packages[^/]*|/Sources[^/]*|/Translation-[^/]*|/Contents-[^/]*|/by-hash/[^/]+/[0-9a-f]+)$
