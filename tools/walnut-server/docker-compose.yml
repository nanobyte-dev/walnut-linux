# walnut.nanobyte.dev (docs/release/ALPHA.md M4): the site and the files behind it, served by one
# nginx on the main proxy's network. The proxy terminates TLS (the *.nanobyte.dev certificate) and
# passes everything on (walnut.nanobyte.dev.conf). The image is walnut-site:<id>, built and switched
# by walnut-watch, which writes WALNUT_SITE_TAG to .env. walnut-upload takes uploads into incoming/
# (upload/Dockerfile); walnut-aptcache caches Debian's snapshot for builds (aptcache/Dockerfile). Deployed by tools/walnut-server/deploy.sh.
name: walnut

services:
  walnut-repo:
    image: walnut-site:${WALNUT_SITE_TAG:-none}
    container_name: walnut-repo
    mem_limit: 256m
    restart: unless-stopped
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    volumes:
      - ./www:/srv/walnut:ro
      # user:hash lines for /licensed/ (not tracked; deploy.sh writes it)
      - ./htpasswd:/etc/nginx/walnut.htpasswd:ro
    networks:
      - mainproxy_net
      - aptcache

  # Debian's snapshot cache for builds (aptcache/Dockerfile), reached only through walnut-repo
  walnut-aptcache:
    build: ./aptcache
    image: walnut-aptcache:local
    container_name: walnut-aptcache
    user: "1000:1000"
    mem_limit: 256m
    restart: unless-stopped
    read_only: true
    tmpfs: ["/run/apt-cacher-ng:uid=1000,gid=1000", "/var/log/apt-cacher-ng:uid=1000,gid=1000", /tmp]
    volumes:
      # CACHEDIR.TAG inside: restic (--exclude-caches) leaves it out of the backups
      - ./aptcache-data:/var/cache/apt-cacher-ng
    networks:
      - aptcache

  # ccache's remote storage for builds (ccache/nginx.conf), behind the main proxy at /ccache/
  walnut-ccache:
    image: nginx:stable-alpine
    container_name: walnut-ccache
    user: "1000:1000"
    mem_limit: 128m
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:uid=1000,gid=1000"]
    command: ["nginx", "-g", "daemon off;", "-c", "/etc/nginx/ccache.conf"]
    volumes:
      - ./ccache/nginx.conf:/etc/nginx/ccache.conf:ro
      - ./ccache.htpasswd:/etc/nginx/ccache.htpasswd:ro
      # CACHEDIR.TAG inside: restic (--exclude-caches) leaves it out of the backups
      - ./ccache-data:/srv/ccache
    networks:
      - mainproxy_net

  walnut-upload:
    build: ./upload
    image: walnut-upload:local
    container_name: walnut-upload
    user: "1000:1000"
    mem_limit: 64m
    pids_limit: 64
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp, /run, "/home/walnut-deploy:uid=1000,gid=1000,mode=700"]
    # IPv4 only: over IPv6 docker-proxy would hide the client's address from sshd and fail2ban
    ports: ["0.0.0.0:2223:2222"]
    # sshd's log to the journal, where fail2ban's walnut-upload jail reads it
    logging:
      driver: journald
      options: {tag: walnut-upload}
    volumes:
      - ./incoming:/incoming
      # ssh_host_ed25519_key (made once by deploy.sh) and authorized_keys (from deploy-keys.pub)
      - ./upload-keys:/keys:ro
    networks:
      - upload

networks:
  mainproxy_net:
    external: true
  upload: {}
  aptcache: {}
