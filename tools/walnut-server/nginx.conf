# The files behind walnut.nanobyte.dev. www/ holds:
#   apt/      the signed public suites (stable, testing), published by aptly on the dev PC
#   licensed/ the licensed suite: game data we may not redistribute, for the project owner only
#   download/ release images, kernels, the installer, SHA256SUMS
#   index.html
server {
    listen 80 default_server;
    root /usr/share/nginx/walnut;
    autoindex on;
    sendfile on;
    access_log /dev/stdout;

    # indices change on every publish; pool files and downloads never do
    location ~ ^/(apt|licensed)/.*/dists/ { add_header Cache-Control no-cache; }

    location /licensed/ {
        auth_basic "Walnut licensed";
        auth_basic_user_file /etc/nginx/walnut.htpasswd;
        location ~ /dists/ { add_header Cache-Control no-cache; }
    }

    location = /health { access_log off; return 200 "ok\n"; }
}
