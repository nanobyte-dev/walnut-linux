# walnut-repo's nginx: the site (in the image) and, mounted read-only from /data/nanobyte/Walnut/www:
#   apt/      the signed public suites (stable, testing)
#   licensed/ the licensed suite: game data we may not redistribute, for the project owner only
#   download/ release images, kernels, the installer, SHA256SUMS
# walnut-watch publishes into these; its work in progress has hidden names, never served.
server {
    listen 80 default_server;
    root /usr/share/nginx/walnut-site;
    sendfile on;
    access_log /dev/stdout;

    location ~ /\. { return 404; }

    location /apt/ {
        root /srv/walnut;
        autoindex on;
        location ~ /dists/ { add_header Cache-Control no-cache; }
    }
    location /download/ {
        root /srv/walnut;
        autoindex on;
    }
    location /licensed/ {
        root /srv/walnut;
        autoindex on;
        auth_basic "Walnut licensed";
        auth_basic_user_file /etc/nginx/walnut.htpasswd;
        location ~ /dists/ { add_header Cache-Control no-cache; }
    }
    # Debian's snapshot for builds (CI and the dev PC), through walnut-aptcache: the pinned snapshot
    # dates only, which deploy.sh fills in from config.mk and the upstream.mk files
    location ~ ^/debian-snapshot/archive/(debian|debian-ports|debian-security)/(@SNAPSHOT_DATES@)/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $up_cache walnut-aptcache;
        proxy_pass http://$up_cache:3142;
        proxy_buffering off;
        proxy_read_timeout 600s;
        access_log off;
    }
    location /debian-snapshot/ { return 404; }
    location = /version.txt { add_header Cache-Control no-cache; }
    location = /health { access_log off; return 200 "ok\n"; }
}
