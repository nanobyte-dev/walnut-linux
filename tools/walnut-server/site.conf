# walnut-site's nginx: the welcome page (site/, built into the image walnut-site:<id> by
# walnut-watch). The repository's paths are walnut-repo's; the main proxy routes them there.
server {
    listen 80 default_server;
    root /usr/share/nginx/walnut-site;
    sendfile on;
    access_log /dev/stdout;
    location ~ /\. { return 404; }
    location = /version.txt { add_header Cache-Control no-cache; }
    location = /health { access_log off; return 200 "ok\n"; }
}
