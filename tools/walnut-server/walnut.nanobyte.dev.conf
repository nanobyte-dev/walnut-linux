# walnut.nanobyte.dev: Walnut Linux's apt suites and downloads (the walnut-repo container,
# /data/nanobyte/Walnut). Tracked in the Walnut repository as tools/walnut-server/walnut.nanobyte.dev.conf.
# No indexing until the 0.1-alpha release (then `set $allow_indexing 1;`).
server {
    listen 80;
    listen [::]:80;
    server_name walnut.nanobyte.dev;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    # the Debian snapshot cache over plain http too: a fresh Debian image has no CA certificates
    # yet when apt first runs; apt checks Debian's signatures either way
    location /debian-snapshot/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $up_walnut walnut-repo;
        proxy_pass http://$up_walnut:80;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 600s;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name walnut.nanobyte.dev;

    ssl_certificate     /etc/letsencrypt/live/nanobyte.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nanobyte.dev/privkey.pem;
    include /etc/nginx/snippets/config-ssl.conf;
    include /etc/nginx/snippets/config-headers.conf;

    # ccache's remote storage (the walnut-ccache container): builds only, through tools/ccache-relay.py
    location /ccache/ {
        set $up_ccache walnut-ccache;
        proxy_pass http://$up_ccache:8080;
        client_max_body_size 256m;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # the repository's files: walnut-repo, which a site update never restarts
    location ~ ^/(apt|download|licensed|status|debian-snapshot)/ {
        set $up_repo walnut-repo;
        proxy_pass http://$up_repo:80;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 600s;
    }

    location / {
        set $up_walnut walnut-site;
        proxy_pass http://$up_walnut:80;
        # images are a few hundred MB: stream them, don't spool them on the proxy
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 300s;
    }
}
