# Native package: this directory is the source (tools/deb-prepare.sh, deb-build.sh)
TYPE=native
SOURCE=walnut-games
BUILD=indep
# the games catalog (make gamedb-catalog, tools/gamedb/pack-catalog.py): catalog.json, thumbnails and
# screenshots, unpacked to /usr/share/walnut-games/ by debian/rules
COPY_IN="build/gamedb/catalog.tar:catalog/catalog.tar"
VERSION_PATHS="gamedb/content tools/gamedb/catalog.py"
