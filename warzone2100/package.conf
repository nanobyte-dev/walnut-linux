# Upstream source (Debian's is 4.7 and needs GL 3): Warzone 2100 release 4.3.5, the last with an
# OpenGL 2.1 / OpenGL ES 2.0 renderer and GLSL 1.20 shaders (4.4 and later need GL 3.0). The
# Makefile downloads the pinned release tarball (config.mk WARZONE_*) and passes the path as
# WZ_ORIG. debian/ is Debian bookworm's 4.3.3-3 packaging, rewritten for sid and cut down: no
# Vulkan, no Basis Universal, no Discord, no documentation. Builds warzone2100, warzone2100-data
# and warzone2100-music (both arch all, built in the same chroot run).
TYPE=upstream
SOURCE=warzone2100
UPVER=4.3.5
DEBREV=1
ORIG=$WZ_ORIG
COMPONENTS=
BUILD=native
