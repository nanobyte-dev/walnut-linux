# Walnut Games, the games database (docs/GAMEDB.md). Built by tools/gamedb/build.sh with the pinned
# Hugo of tools/gamedb/hugo.version; data/catalog.json (generated by tools/gamedb/catalog.py) holds
# the ratings the templates show.
baseURL = "https://walnut.nanobyte.dev/gamedb/"
title = "Walnut Games"
locale = "en"
# no tag or category pages: the filters on the home page do that job in the browser
disableKinds = ["taxonomy", "term"]
enableRobotsTXT = true
# the games' own `categories` and `tags` are plain catalog fields, not Hugo taxonomies
[taxonomies]

[outputs]
home = ["HTML", "RSS"]
section = ["HTML", "RSS"]

[sitemap]
changefreq = "weekly"
priority = 0.5

[params]
# where "how a game is tested and how a rating is made and submitted" is explained: the about page's section for
# now; the rating tool's own documentation (walnut-rate, planned) when it exists. Relative to the site's root.
ratingDocs = "about/#how-a-game-is-tested"
description = "Games that run on Walnut, the open Linux for the PS3: each one played and measured on the console, compared with a PC, and rated."

# The content: the site's own pages (content/), and the games from the database itself, gamedb/games/<id>/
# (gamedb/README.md), as content/games/<id>/. content/games/_index.md (the section page and its cascade)
# stays here and merges with the mounted bundles. From a bundle only what the pages show comes in (an
# allowlist, so the database's other files never become pages or resources): index.md, thumb.png and
# the sessions' screenshots, shots/*.jpg (the catalog lists the gallery's, the ones a page shows;
# publishResources = false in the cascade publishes only those; shots/pc/ stays out).
[[module.mounts]]
source = "content"
target = "content"

[[module.mounts]]
source = "../../gamedb/games"
target = "content/games"
includeFiles = ["/*/index.md", "/*/thumb.png", "/*/rating/sessions/*/shots/*.jpg"]
