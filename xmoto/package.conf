# Debian source package this directory patches (tools/deb-fetch.sh, deb-prepare.sh, deb-build.sh).
# Fewer, larger GL draws for the PS3's PPE (Mesa nv30): 0001 records the GL state and batches
# DrawLib's primitives into one client array per state run (XMOTO_GL_BATCH=0 turns it off),
# 0002 draws the level's blocks and edges from one buffer (XMOTO_GL_BLOCKS=0); XMOTO_GL_STATS=1
# prints draws per frame. Builds xmoto and xmoto-data (xmoto needs xmoto-data of its own version).
TYPE=debsrc
SOURCE=xmoto
VERSION=0.6.3+repack-1
