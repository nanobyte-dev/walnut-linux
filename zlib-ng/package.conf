# Upstream source (Debian has no zlib-ng): the pinned zlib-ng release tarball (config.mk ZLIBNG_*;
# the Makefile downloads it and passes the path as ZNG_ORIG). Built in zlib-compat mode as a second
# libz.so.1 in a directory of its own, /usr/lib/powerpc64-linux-gnu/zlib-ng, which nothing searches
# by default: a program opts in with LD_LIBRARY_PATH (the bench's ZLIB=ng token). Debian's zlib1g
# stays the system zlib (dpkg and apt use it). CHECK=1: zlib-ng's own tests (gtest) run in the build.
TYPE=upstream
SOURCE=zlib-ng
UPVER=2.3.3
DEBREV=1
ORIG=$ZNG_ORIG
COMPONENTS=
BUILD=native
CHECK=1
